name: CodeQL Security Scan

# Free GitHub-native security analysis. Catches:
#   - Injection patterns (SQL, command, NoSQL)
#   - Hard-coded secrets
#   - Unsafe regex / ReDoS
#   - Path traversal, prototype pollution, unsafe deserialisation
#   - Crypto misuse
#
# Posts findings as PR review comments inline on the diff. No setup
# beyond enabling Code Scanning under repo Settings → Code security.

on:
  push:
    branches: [main, desenv]
  pull_request:
    branches: [main, desenv]
  schedule:
    # Weekly full-repo scan to catch issues introduced via dep updates
    # or pulled in from base branch via merges.
    - cron: '0 6 * * 1'   # Monday 06:00 UTC

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write   # required to post findings to Code Scanning
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # security-extended adds higher-severity rules at the cost of
          # more analysis time; security-and-quality also includes code
          # smells (more noisy).
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript-typescript'
