name: PR Quality Gate

on:
  pull_request:
    branches: [main, desenv]
  push:
    branches: [main, desenv]

# Cancel in-progress runs for the same PR when new commits arrive — saves
# CI minutes and gives faster feedback on the latest push.
concurrency:
  group: pr-quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-test:
    name: Typecheck + tests + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          # SonarCloud needs full git history for accurate "new code" detection.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Run unit + integration tests with coverage (LCOV)
        run: npm run test:ci
        env:
          # Required by tests/helpers/setup.ts at module load.
          DATABASE_URL: postgres://test:test@localhost:5432/test
          # PIN service tests set this themselves; provide a default for any
          # service tests that transitively require it.
          QRC_PIN_PEPPER: ci-test-pepper-32-chars-min-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa

      - name: Upload coverage as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage/
          retention-days: 7

      - name: Upload jest-junit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jest-junit
          path: junit.xml
          retention-days: 7
          if-no-files-found: ignore

  sonarcloud:
    name: SonarCloud scan
    needs: typecheck-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Skip on forks — SonarCloud token is not available to PRs from forks.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Re-run tests to produce coverage for Sonar
        # The sonarcloud job runs in its own runner and needs its own
        # coverage/lcov.info. Cheaper than passing it as an artifact
        # and re-attaching it across jobs.
        run: npm run test:ci
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/test
          QRC_PIN_PEPPER: ci-test-pepper-32-chars-min-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa

      - name: SonarCloud scan
        uses: SonarSource/sonarcloud-github-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
