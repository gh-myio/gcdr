name: PR Quality Gate

on:
  pull_request:
    branches: [main, desenv]
  push:
    branches: [main, desenv]

# Cancel in-progress runs for the same PR when new commits arrive.
concurrency:
  group: pr-quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Typecheck + tests + coverage (with PR comment)
  # ---------------------------------------------------------------------------
  typecheck-and-test:
    name: Typecheck + tests + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write   # for jest-coverage-comment
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Jest tests + coverage
        # Threshold (currently 10% global) is enforced by jest.config.js
        # coverageThreshold. Raise it gradually as old code gets tested.
        run: npm run test:ci
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/test
          WO_PIN_PEPPER: ci-test-pepper-32-chars-min-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa

      - name: Upload coverage HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage/
          retention-days: 7

      - name: Upload jest-junit XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jest-junit
          path: junit.xml
          retention-days: 7
          if-no-files-found: ignore

      - name: Post coverage table on PR
        if: github.event_name == 'pull_request' && always()
        uses: MishaKav/jest-coverage-comment@v1
        with:
          coverage-summary-path: coverage/coverage-summary.json
          junitxml-path: junit.xml
          junitxml-title: Jest results
          summary-title: Coverage summary
          coverage-title: Coverage (lines)
          remove-link-from-badge: true

  # ---------------------------------------------------------------------------
  # ESLint on changed files — "new code" quality gate
  # ---------------------------------------------------------------------------
  lint-changed-files:
    name: Lint (changed files)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: List changed .ts files
        id: changed
        uses: tj-actions/changed-files@v45
        with:
          files: |
            src/**/*.ts
            tests/**/*.ts
            scripts/**/*.ts
          # Keep in sync with .eslintrc.json's ignorePatterns — otherwise a
          # changed *.config.ts file passes eslint's own "should skip this"
          # check as a *warning* on the CLI, which --max-warnings 0 then
          # fails on for a file nobody meant to lint in the first place.
          files_ignore: |
            **/*.config.ts
            **/*.config.js

      - name: ESLint changed files (block on errors)
        if: steps.changed.outputs.any_changed == 'true'
        run: |
          echo "Linting changed files:"
          printf '  %s\n' ${{ steps.changed.outputs.all_changed_files }}
          npx eslint --max-warnings 0 ${{ steps.changed.outputs.all_changed_files }}

      - name: No-op when no .ts changed
        if: steps.changed.outputs.any_changed != 'true'
        run: echo "No .ts files changed in this PR — lint skipped."
