name: Build & Deploy (backend)

# Root-cause fix for the EC2 OOM/freeze on deploy: the Docker image is built HERE
# (GitHub runner), pushed to GHCR, and Dokploy only PULLS the prebuilt image —
# no `docker build` on the EC2 host anymore. Deploys track `desenv` (Dokploy is
# wired to it; main is unused).
#
# Gated: build/deploy only after the quality job (typecheck + lint + tests).
# The Dokploy redeploy step is gated behind repo variable DEPLOY_TRIGGER_ENABLED
# so the first runs only publish the image (no on-host build via the API). After
# the Dokploy app is switched to the Docker (image) provider, set it to 'true'
# for pull-only auto-redeploys.
#
# Secrets:   DOKPLOY_URL, DOKPLOY_API_TOKEN, DOKPLOY_APP_ID (backend app id)
# Variables: APP_URL (health check), DEPLOY_TRIGGER_ENABLED, SLACK_WEBHOOK (opt)
# GHCR publish uses the automatic GITHUB_TOKEN via packages: write.
#
# Migrations run at container start (CMD -> dist/scripts/migrate.js); runtime env
# (DATABASE_URL, JWT_SECRET, S3_*) stays in Dokploy. The CI build needs no DB.

on:
  push:
    branches: [desenv]
  workflow_dispatch: {}

env:
  IMAGE: ghcr.io/${{ github.repository }}   # ghcr.io/gh-myio/gcdr
  APP_NAME: gcdr-api

jobs:
  # ---------------------------------------------------------------------------
  # 1) QUALITY GATE — if this fails, nothing is built/published/deployed.
  # ---------------------------------------------------------------------------
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Jest + coverage
        run: npm run test:ci
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/test
          WO_PIN_PEPPER: ci-test-pepper-32-chars-min-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa

  # ---------------------------------------------------------------------------
  # 2) BUILD IMAGE + DEPLOY — only after the gate passes.
  # ---------------------------------------------------------------------------
  build-deploy:
    name: Build image + deploy
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Notify deploy start
        if: ${{ vars.SLACK_WEBHOOK != '' }}
        run: |
          curl -X POST "${{ vars.SLACK_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d "{\"text\": \"🚀 Building & deploying ${{ env.APP_NAME }}...\"}" || true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production            # multi-stage: production stage
          push: true
          platforms: linux/amd64        # EC2 t3 = x86_64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Dokploy redeploy (pull prebuilt image)
        id: deploy
        # Gated OFF during cutover so the first runs only publish the image to
        # GHCR (no Dokploy redeploy → no on-host build). After switching the
        # Dokploy app to the Docker (image) provider, set repo variable
        # DEPLOY_TRIGGER_ENABLED=true for pull-only auto-redeploys.
        if: ${{ vars.DEPLOY_TRIGGER_ENABLED == 'true' }}
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.DOKPLOY_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.DOKPLOY_URL }}/api/application.redeploy" \
            -d '{"applicationId": "${{ secrets.DOKPLOY_APP_ID }}"}')
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "Response: $BODY"
          echo "HTTP Code: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Deployment trigger failed with status $HTTP_CODE"
            exit 1
          fi
          echo "Deployment triggered successfully"

      - name: Health check
        if: ${{ vars.DEPLOY_TRIGGER_ENABLED == 'true' }}
        run: |
          echo "Waiting for the API to come up..."
          sleep 25
          for i in $(seq 1 15); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "${{ vars.APP_URL }}/health" || echo 000)
            if [ "$code" = "200" ]; then echo "✅ Health check passed"; exit 0; fi
            echo "Attempt $i: health returned $code, retrying in 10s..."
            sleep 10
          done
          echo "::warning::Health check did not pass after 15 attempts"

      - name: Notify deploy success
        if: success() && vars.SLACK_WEBHOOK != ''
        run: |
          curl -X POST "${{ vars.SLACK_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d "{\"text\": \"✅ ${{ env.APP_NAME }} image published (${{ github.sha }})\"}" || true

      - name: Notify deploy failure
        if: failure() && vars.SLACK_WEBHOOK != ''
        run: |
          curl -X POST "${{ vars.SLACK_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d "{\"text\": \"❌ ${{ env.APP_NAME }} build/deploy FAILED — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" || true
