services:
  # ==========================================================================
  # GCDR API Service
  # ==========================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: ${BUILD_TARGET:-production}
    container_name: gcdr-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-3015}:3015"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3015
      HOST: 0.0.0.0

      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-db_gcdr}

      # JWT Configuration
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ISSUER: ${JWT_ISSUER:-gcdr}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-gcdr-api}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}

      # CORS
      CORS_ORIGIN: ${CORS_ORIGIN:-*}

      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-info}

      # S3-compatible storage (MYIO Knowledge — RFC-0030 / RFC-0031)
      # When running inside compose, talk to the minio service via the
      # internal docker DNS name "minio". Override S3_ENDPOINT in your
      # host .env if you run the API outside docker.
      S3_ENDPOINT: ${S3_ENDPOINT_INTERNAL:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-myio-knowledge-dev}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      S3_UPLOAD_MAX_BYTES: ${S3_UPLOAD_MAX_BYTES:-10485760}
    volumes:
      # For development: mount source code
      - ${DEV_MOUNT:-/dev/null}:/app/src:ro
      # Scripts for DB Admin UI
      - ./scripts:/app/scripts:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - gcdr-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3015/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ==========================================================================
  # PostgreSQL Database
  # ==========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: gcdr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-db_gcdr}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      # Performance tuning
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - gcdr-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-db_gcdr}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================================================
  # MinIO — S3-compatible object storage for local dev (RFC-0030 / RFC-0031)
  # ==========================================================================
  # Console:    http://localhost:9001 (login: minioadmin / minioadmin)
  # S3 API:     http://localhost:9000   (from host)
  #             http://minio:9000       (from inside the gcdr-network)
  # Bucket "myio-knowledge-dev" is created by the minio-init service below.
  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    container_name: gcdr-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    volumes:
      - minio-data:/data
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    networks:
      - gcdr-network
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ==========================================================================
  # MinIO bucket bootstrap — runs once, exits when done
  # ==========================================================================
  # Idempotent: re-running docker compose up does not recreate the bucket.
  # Mirrors what scripts/aws/provision-knowledge-bucket.sh does for prod.
  minio-init:
    image: minio/mc:RELEASE.2025-01-17T23-25-50Z
    container_name: gcdr-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      set -e;
      /usr/bin/mc alias set local http://minio:9000 ${S3_ACCESS_KEY_ID:-minioadmin} ${S3_SECRET_ACCESS_KEY:-minioadmin};
      /usr/bin/mc mb --ignore-existing local/${S3_BUCKET:-myio-knowledge-dev};
      /usr/bin/mc version enable local/${S3_BUCKET:-myio-knowledge-dev};
      /usr/bin/mc anonymous set none local/${S3_BUCKET:-myio-knowledge-dev};
      /usr/bin/mc encrypt set sse-s3 local/${S3_BUCKET:-myio-knowledge-dev} || true;
      echo 'MinIO bucket ready: ${S3_BUCKET:-myio-knowledge-dev}';
      "
    networks:
      - gcdr-network

# =============================================================================
# Networks
# =============================================================================
networks:
  gcdr-network:
    driver: bridge

# =============================================================================
# Volumes
# =============================================================================
volumes:
  pgdata:
    driver: local
  minio-data:
    driver: local
