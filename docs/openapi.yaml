  /rules/{id}/trigger:
    post:
      tags: [Rules]
      summary: Record a rule trigger event
      description: |
        Called by the alarm-orchestrator when a rule fires (`triggered=true`).
        Atomically increments `triggerCount` and sets `lastTriggeredAt` to the current timestamp.

        **Note:** use the `parentRuleId` (real UUID) when the rule is a composite variant
        (`ruleId_deviceId`) from the bundle — composite IDs are not database records.
      operationId: triggerRule
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                count:
                  type: integer
                  minimum: 1
                  maximum: 10000
                  default: 1
                  description: Number of trigger events to record (default 1). Use for backfill.
                triggeredAt:
                  type: string
                  format: date-time
                  description: Timestamp of the trigger event (default now). Use for backfill with historical date.
            examples:
              realtime:
                summary: Real-time trigger (orchestrator)
                value: {}
              backfill:
                summary: Backfill 300 events
                value: { "count": 300, "triggeredAt": "2026-01-15T10:00:00Z" }
      responses:
        '200':
          description: Trigger recorded
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                          lastTriggeredAt:
                            type: string
                            format: date-time
                          triggerCount:
                            type: integer
                            example: 43
        '404':
          description: Rule not found

