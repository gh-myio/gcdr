        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/WikiNamespace' }
        '409':
          description: Namespace already exists
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }

  /api/v1/wiki/namespaces/{name}:
    parameters:
      - in: path
        name: name
        required: true
        schema: { type: string }
    patch:
      tags: [Wiki]
      summary: Update a namespace's description / reviewRequired
      operationId: updateWikiNamespace
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateWikiNamespaceRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/WikiNamespace' }
    delete:
      tags: [Wiki]
      summary: Delete a namespace (only if it contains zero pages)
      operationId: deleteWikiNamespace
      responses:
        '204': { description: Deleted }
        '409':
          description: Namespace still contains pages
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }

  /api/v1/wiki/pages:
    get:
      tags: [Wiki]
      summary: List wiki pages (filtered by user's effective audiences)
      operationId: listWikiPages
      parameters:
        - in: query
          name: namespace
          schema: { type: string }
        - in: query
          name: status
          schema: { $ref: '#/components/schemas/WikiPageStatus' }
        - in: query
          name: tag
          schema: { type: string }
        - in: query
          name: q
          schema: { type: string, description: "Title prefix (full-text is /search)" }
        - in: query
          name: includeDeleted
          schema: { type: boolean, default: false }
        - in: query
          name: page
          schema: { type: integer, minimum: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/WikiPage' }
    post:
      tags: [Wiki]
      summary: Create a new page (revision #1 persisted atomically)
      operationId: createWikiPage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateWikiPageRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/WikiPage'
                          - type: object
                            properties:
                              extractedLinks:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    entityType: { $ref: '#/components/schemas/WikiEntityType' }
                                    entityId: { type: string }
        '403':
          description: Caller cannot assign the requested visibility
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '409':
          description: A page with the same (namespace, slug) already exists
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }

  /api/v1/wiki/pages/by-slug/{namespace}/{slug}:
    get:
      tags: [Wiki]
      summary: Lookup a page by canonical (namespace, slug). Returns currentRevision inline.
      operationId: getWikiPageBySlug
      parameters:
        - in: path
          name: namespace
          required: true
          schema: { type: string }
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/WikiPageWithRevision' }
        '404':
          description: Not found OR caller has no read overlap
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }

  /api/v1/wiki/pages/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Wiki]
      summary: Get a page by id with currentRevision inline
      operationId: getWikiPageById
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/WikiPageWithRevision' }
    put:
      tags: [Wiki]
      summary: Append a new revision and update page metadata atomically
      operationId: updateWikiPage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateWikiPageRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/WikiPageWriteResult' }
    delete:
      tags: [Wiki]
      summary: Soft-delete the page
      operationId: deleteWikiPage
      responses:
        '204': { description: Deleted }

  /api/v1/wiki/pages/{id}/move:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Wiki]
      summary: Rename namespace and/or slug
      operationId: moveWikiPage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MoveWikiPageRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/WikiPage' }
        '409':
