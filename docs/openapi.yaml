          nullable: true
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
        lastUsedIp:
          type: string
          nullable: true
        usageCount:
          type: integer
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
          format: uuid

    CreateCustomerApiKey:
      type: object
      required:
        - name
        - scopes
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 100
        description:
          type: string
          maxLength: 500
        scopes:
          type: array
          items:
            type: string
          description: 'API scopes (e.g., bundles:read, rules:read, devices:read)'
        expiresAt:
          type: string
          format: date-time
          description: Optional expiration date

    # Audit Log Schemas
    AuditLogResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/AuditLog'

    AuditLogListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AuditLog'
            cursor:
              type: string
              nullable: true
            hasMore:
              type: boolean

    AuditLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
          nullable: true
        userId:
          type: string
          format: uuid
          nullable: true
        actorType:
          type: string
          enum: [USER, SERVICE, SYSTEM, API_KEY]
        entityType:
          type: string
          description: Entity type (CUSTOMER, DEVICE, RULE, etc.)
        entityId:
          type: string
          format: uuid
          nullable: true
        action:
          type: string
          enum: [CREATE, READ, UPDATE, DELETE, LOGIN, LOGOUT, EXPORT]
        eventCategory:
          type: string
          enum: [AUTH, DATA, ADMIN, SYSTEM]
        description:
          type: string
        httpMethod:
          type: string
        httpPath:
          type: string
        statusCode:
          type: integer
        durationMs:
          type: integer
        previousValue:
          type: object
          nullable: true
        newValue:
          type: object
          nullable: true
        metadata:
          type: object
          additionalProperties: true
        ipAddress:
          type: string
        userAgent:
          type: string
        errorMessage:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    ResponseMeta:
      type: object
      properties:
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time

    # Templates (RFC-0021)
    Template:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          example: alarm-notification-v1
        tenantId:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
          nullable: true
          description: "null = tenant default template; UUID = customer-specific override"
        name:
          type: string
        type:
          type: string
          enum: [EMAIL_ALARM, EMAIL_REPORT, EMAIL_WELCOME, RELEASE_NOTE, NOTIFICATION, INSIGHT]
        status:
          type: string
          enum: [DRAFT, ACTIVE, ARCHIVED]
        htmlContent:
          type: string
          description: Full HTML content with {{variable}} and {{#each list}} tags
        description:
          type: string
          nullable: true
        version:
          type: integer
        createdBy:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TemplateSummary:
      type: object
      description: Template without htmlContent
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        tenantId:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
          nullable: true
          description: "null = tenant default; UUID = customer-specific override"
        name:
          type: string
        type:
          type: string
          enum: [EMAIL_ALARM, EMAIL_REPORT, EMAIL_WELCOME, RELEASE_NOTE, NOTIFICATION, INSIGHT]
        status:
          type: string
          enum: [DRAFT, ACTIVE, ARCHIVED]
        description:
          type: string
          nullable: true
        version:
          type: integer
        createdBy:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TemplateRenderResult:
      type: object
      properties:
        html:
          type: string
          description: HTML ready for tag substitution (GET) or fully rendered (POST)
        template:
          type: object
          properties:
            id:
              type: string
              format: uuid
            slug:
              type: string
            type:
              type: string
            version:
              type: integer
            status:
              type: string
            customerId:
              type: string
              format: uuid
              nullable: true
        theme:
          type: object
          nullable: true
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            customerId:
              type: string
              format: uuid
        templateSource:
          type: string
          enum: [customer, parent_customer, tenant]
          description: "customer = template owned by this customer; parent_customer = inherited from parent; tenant = tenant default"
        themeSource:
          type: string
          enum: [customer_type, customer_default, parent_default, tenant]
          description: "customer_type = theme for this specific template type; customer_default = generic customer theme; parent_default = parent's theme; tenant = MYIO fallback"

    CreateTemplate:
      type: object
      required: [slug, name, type, htmlContent]
      properties:
        slug:
          type: string
          pattern: '^[a-z0-9-]+$'
          example: alarm-notification-v1
        name:
          type: string
          example: Alarm Notification Email
        type:
          type: string
          enum: [EMAIL_ALARM, EMAIL_REPORT, EMAIL_WELCOME, RELEASE_NOTE, NOTIFICATION, INSIGHT]
        status:
          type: string
          enum: [DRAFT, ACTIVE, ARCHIVED]
          default: DRAFT
        htmlContent:
          type: string
        description:
          type: string
        customerId:
          type: string
          format: uuid
          nullable: true
          description: "Omit or null for tenant default; UUID for customer-specific override"

    UpdateTemplate:
      type: object
      properties:
        name:
          type: string
        status:
          type: string
          enum: [DRAFT, ACTIVE, ARCHIVED]
        htmlContent:
          type: string
        description:
          type: string

    TemplateTag:
      type: object
      properties:
        tag:
          type: string
          example: '{{customerName}}'
        description:
          type: string
          example: Name of the customer

    TemplateLoopTag:
      type: object
      properties:
        tag:
          type: string
          example: '{{#each rules}}'
        closeTag:
          type: string
          example: '{{/each}}'
        description:
          type: string
        itemTags:
          type: array
          items:
            $ref: '#/components/schemas/TemplateTag'

    GroupChannel:
      type: object
      description: Per-group channel routing target. Stores WHERE to send (chat_id, email, URL). Credentials stay in customer_channels.
      required: [id, tenantId, groupId, channel, active, target]
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        groupId:
          type: string
          format: uuid
        channel:
          type: string
          enum: [EMAIL, TELEGRAM, WHATSAPP, WEBHOOK, SLACK, SMS, TEAMS, CUSTOM]
        active:
          type: boolean
        target:
          type: string
          description: |
            Routing destination for this channel:
            EMAIL → email address ("ops@company.com")
            TELEGRAM → chat_id ("-100123456789")
            WHATSAPP → phone number ("+5531988880000")
            WEBHOOK → URL ("https://hooks.company.com/gcdr")
            SLACK → channel name ("#alertas")
          example: '-100123456789'
        config:
          type: object
          additionalProperties: true
          description: Optional extra config (e.g. webhook method/headers)
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    GroupDispatchEntry:
      type: object
      description: Single entry in the group dispatch matrix (channel × action × active × delay)
      required: [id, tenantId, groupId, channel, action, active, escalationDelayMs]
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        groupId:
          type: string
          format: uuid
        channel:
          type: string
          enum: [EMAIL, TELEGRAM, WHATSAPP, WEBHOOK, SLACK, SMS, TEAMS, CUSTOM]
        action:
          type: string
          enum: [OPEN, ACK, ESCALATE, SNOOZE, CLOSE, STATE_HISTORY]
        active:
          type: boolean
        escalationDelayMs:
          type: integer
          minimum: 0
          description: Delay in milliseconds before this channel fires for this action (0 = immediate)
          example: 5000
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    RuleMeta:
      type: object
      description: |
        Simplified rule summary used in the EnrichedCustomer response (`GET /customers/external/:id?allRules=1`).
        The `id` field may be a plain rule UUID or a synthesized key of the form `{ruleId}_{deviceId}`
        when the rule has a per-device value override (`scopeEntityOverrides`). In that case `parentRuleId`
        is set to the base rule UUID.
      required: [id, name, scope, metric, operator, value]
      properties:
        id:
          type: string
          description: Rule UUID or synthesized override key (`{ruleId}_{deviceId}`)
          example: 'cccc0001-0001-0001-0001-000000000002_6857b8cb-34aa-4e2e-9113-8598c2601f31'
        parentRuleId:
          type: string
          format: uuid
          description: Base rule UUID — only present when `id` is a synthesized override key
          example: 'cccc0001-0001-0001-0001-000000000002'
        name:
          type: string
          example: 'Consumo Elevado'
        description:
          type: string
          example: 'Dispara quando o consumo instantâneo superar o limite configurado'
        scope:
          type: object
          properties:
            type:
              type: string
              enum: [GLOBAL, CUSTOMER, ASSET, DEVICE]
            entityId:
              type: string
              format: uuid
        metric:
          type: string
          example: 'instantaneous_power'
        operator:
          type: string
          enum: [GT, GTE, LT, LTE, EQ, NEQ, BETWEEN, OUTSIDE, UNCHANGED]
          example: 'GT'
        value:
          type: number
          description: Trigger threshold — may be overridden per device (see parentRuleId)
          example: 299
        valueHigh:
          type: number
          description: Upper bound for BETWEEN/OUTSIDE operators
        duration:
          type: integer
          description: Seconds the condition must persist before firing
        hysteresis:
          type: number
        aggregation:
          type: string
          enum: [AVG, MIN, MAX, SUM, COUNT, LAST]
        startAt:
          type: string
          pattern: '^\d{2}:\d{2}$'
          example: '08:00'
        endAt:
          type: string
          pattern: '^\d{2}:\d{2}$'
          example: '18:00'
        daysOfWeek:
          type: object
          description: Map of day index (0=Sun … 6=Sat) to active boolean
          example: { "0": false, "1": true, "2": true, "3": true, "4": true, "5": true, "6": false }
        channelId:
          type: integer
          description: Channel index for multi-channel OUTLET devices
        keyMulti:
          type: number
          description: Energy unit multiplier (1 = W, 0.25 = Wh)
          default: 1

    SetDeviceOverride:
      type: object
      description: Per-device value override for an alarm threshold rule
      properties:
        value:
          type: number
          description: Override trigger threshold for this device
          example: 299
        valueHigh:
          type: number
          description: Override upper bound for BETWEEN/OUTSIDE operators

    # =========================================================================
    # Wiki schemas (RFC-0030)
    # =========================================================================

    WikiAudience:
      type: string
      enum: [PUBLIC, MYIO_INTERNAL, PARTNERS, HOLDING_CUSTOMERS, NON_HOLDING_CUSTOMERS, TENANT_PRIVATE]
      description: |
        Audience tag controlling who can read a wiki page.
        Read access is granted when `page.visibility` overlaps the user's effectiveAudiences set.

    WikiPageStatus:
      type: string
      enum: [DRAFT, REVIEW, PUBLISHED, ARCHIVED]

    WikiEntityType:
      type: string
      enum: [device, customer, rule, asset, central, group, user, rfc]
      description: Entity type referenced from page bodies via `@type:id` tokens.

    WikiPage:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        namespace: { type: string, example: "Runbooks" }
        slug: { type: string, example: "chiller-overheating" }
        title: { type: string }
        status: { $ref: '#/components/schemas/WikiPageStatus' }
        currentRevisionId: { type: string, format: uuid, nullable: true }
        tags: { type: array, items: { type: string } }
        visibility: { type: array, items: { $ref: '#/components/schemas/WikiAudience' }, minItems: 1 }
        frontmatter: { type: object, additionalProperties: true }
        createdBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        deletedAt: { type: string, format: date-time, nullable: true }
        version: { type: integer }
      required: [id, tenantId, namespace, slug, title, status, tags, visibility, frontmatter, createdBy, createdAt, updatedAt]

    WikiPageRevision:
      type: object
      properties:
        id: { type: string, format: uuid }
        pageId: { type: string, format: uuid }
        revisionNumber: { type: integer, minimum: 1 }
        title: { type: string }
        body: { type: string, description: "Markdown source" }
        bodyHtml: { type: string, description: "Server-rendered HTML (DOMPurify-sanitised)" }
        frontmatter: { type: object, additionalProperties: true }
        changeNote: { type: string, nullable: true }
        authorId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
      required: [id, pageId, revisionNumber, title, body, bodyHtml, authorId, createdAt]

    WikiPageWithRevision:
      allOf:
        - $ref: '#/components/schemas/WikiPage'
        - type: object
          properties:
            currentRevision: { $ref: '#/components/schemas/WikiPageRevision', nullable: true }

    WikiNamespace:
      type: object
      properties:
        tenantId: { type: string, format: uuid }
        name: { type: string, example: "Runbooks" }
        description: { type: string, nullable: true }
        reviewRequired: { type: boolean }
        createdAt: { type: string, format: date-time }
      required: [tenantId, name, reviewRequired, createdAt]

    WikiSearchHit:
      type: object
      properties:
        pageId: { type: string, format: uuid }
        namespace: { type: string }
        slug: { type: string }
        title: { type: string }
        snippet: { type: string, description: "ts_headline excerpt with <b>...</b> highlights" }
        rank: { type: number, format: float }
        updatedAt: { type: string, format: date-time }
        visibility: { type: array, items: { $ref: '#/components/schemas/WikiAudience' } }
        tags: { type: array, items: { type: string } }
      required: [pageId, namespace, slug, title, rank, updatedAt, visibility, tags]

    WikiBacklink:
      type: object
      properties:
        pageId: { type: string, format: uuid }
        namespace: { type: string }
        slug: { type: string }
        title: { type: string }
        updatedAt: { type: string, format: date-time }
      required: [pageId, namespace, slug, title, updatedAt]

    WikiVisibilityPreset:
      type: object
      properties:
        id: { type: string, example: "private" }
        label: { type: string, example: "Privado (apenas minha organização)" }
        tags: { type: array, items: { $ref: '#/components/schemas/WikiAudience' } }
      required: [id, label, tags]

    WikiVisibilityOptions:
      type: object
      properties:
        allowedTags: { type: array, items: { $ref: '#/components/schemas/WikiAudience' } }
        presets: { type: array, items: { $ref: '#/components/schemas/WikiVisibilityPreset' } }
      required: [allowedTags, presets]

    WikiEffectiveAudiences:
      type: object
      properties:
        audiences: { type: array, items: { $ref: '#/components/schemas/WikiAudience' } }
        reasons: { type: array, items: { type: string } }
      required: [audiences, reasons]

    WikiRevisionDiff:
      type: object
      properties:
        diff: { type: string, description: "Unified-diff text (LCS-based)" }
        a: { type: integer }
        b: { type: integer }
      required: [diff, a, b]

    WikiPageWriteResult:
      type: object
      description: Returned by create / update / rollback — both the page and the revision they produced.
      properties:
        page: { $ref: '#/components/schemas/WikiPage' }
        revision: { $ref: '#/components/schemas/WikiPageRevision' }
      required: [page, revision]

    CreateWikiPageRequest:
      type: object
      properties:
        namespace: { type: string, pattern: "^[A-Za-z][A-Za-z0-9_-]{0,31}$" }
        slug:      { type: string, pattern: "^[a-z0-9][a-z0-9/_-]{0,127}$" }
        title:     { type: string, minLength: 1, maxLength: 200 }
        body:      { type: string, maxLength: 524288 }
        tags:      { type: array, items: { type: string }, maxItems: 20 }
        visibility: { type: array, items: { $ref: '#/components/schemas/WikiAudience' }, minItems: 1 }
        frontmatter: { type: object, additionalProperties: true }
        status:    { type: string, enum: [DRAFT, PUBLISHED] }
        changeNote: { type: string, maxLength: 500 }
      required: [namespace, slug, title, body]

    UpdateWikiPageRequest:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        body: { type: string, maxLength: 524288 }
        tags: { type: array, items: { type: string }, maxItems: 20 }
        visibility: { type: array, items: { $ref: '#/components/schemas/WikiAudience' }, minItems: 1 }
        frontmatter: { type: object, additionalProperties: true }
        changeNote: { type: string, maxLength: 500 }
      required: [body]

    MoveWikiPageRequest:
      type: object
      properties:
        namespace: { type: string }
        slug: { type: string }
      description: At least one of `namespace` or `slug` must be provided.

    PublishWikiPageRequest:
      type: object
      properties:
        changeNote: { type: string, maxLength: 500 }

    CreateWikiNamespaceRequest:
      type: object
      properties:
        name: { type: string, pattern: "^[A-Za-z][A-Za-z0-9_-]{0,31}$" }
        description: { type: string, maxLength: 500 }
        reviewRequired: { type: boolean, default: false }
      required: [name]

    UpdateWikiNamespaceRequest:
      type: object
      properties:
        description: { type: string, maxLength: 500 }
        reviewRequired: { type: boolean }

    # =========================================================================
    # File Assets schemas (RFC-0030 Phase 4 / RFC-0031)
    # =========================================================================

    FileAssetOwnerType:
      type: string
      enum: [wiki_page, wiki_pdf, free]

    FileAssetStatus:
      type: string
      enum: [PENDING_UPLOAD, ACTIVE, QUARANTINED, DELETED]

    FileAssetScanStatus:
      type: string
      enum: [PENDING, CLEAN, INFECTED, SKIPPED]

    FileAssetStorageProvider:
      type: string
      enum: [S3, MINIO, LOCAL]

    FileAsset:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        customerId: { type: string, format: uuid, nullable: true }
        ownerType: { $ref: '#/components/schemas/FileAssetOwnerType' }
        ownerId: { type: string, nullable: true }
        filename: { type: string }
        contentType: { type: string, example: "image/png" }
        byteSize: { type: integer, format: int64, minimum: 0 }
        sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        storageProvider: { $ref: '#/components/schemas/FileAssetStorageProvider' }
        storageBucket: { type: string }
        storageKey: { type: string }
        status: { $ref: '#/components/schemas/FileAssetStatus' }
        scanStatus: { $ref: '#/components/schemas/FileAssetScanStatus' }
        uploadedBy: { type: string, format: uuid }
        uploadedAt: { type: string, format: date-time }
        deletedAt: { type: string, format: date-time, nullable: true }
        metadata: { type: object, additionalProperties: true }
        publicSlug:
          type: string
          nullable: true
          pattern: "^[a-z0-9][a-z0-9/_-]{0,127}$"
          description: |
            Optional human-readable slug for stable public URLs:
              GET /api/v1/public/files/by-slug/<publicSlug>
            Unique per tenant among non-deleted rows.
      required: [id, tenantId, ownerType, filename, contentType, byteSize, sha256, storageProvider, storageBucket, storageKey, status, scanStatus, uploadedBy, uploadedAt, metadata]

    SetPublicSlugRequest:
      type: object
      properties:
        publicSlug:
          type: string
          nullable: true
          pattern: "^[a-z0-9][a-z0-9/_-]{0,127}$"
          description: Pass `null` to clear the slug.
      required: [publicSlug]

    FileAssetWithDownloadUrl:
      allOf:
        - $ref: '#/components/schemas/FileAsset'
        - type: object
          properties:
            downloadUrl:
              type: string
              format: uri
              description: Presigned S3 URL valid for 5 minutes.
          required: [downloadUrl]

    FileAssetDownloadResponse:
      type: object
      properties:
        url: { type: string, format: uri }
        expiresInSeconds: { type: integer, minimum: 30, maximum: 3600 }
        filename: { type: string }
        contentType: { type: string }
      required: [url, expiresInSeconds, filename, contentType]

    # =========================================================================
    # RFC-0037 — Work Orders module schemas (operator-pin auth, viewer-login)
    # =========================================================================

    OperatorPinRequest:
      type: object
      required: [pin, tenantId]
      properties:
        pin:      { type: string, pattern: '^\d{4}$', example: '1234' }
        tenantId: { type: string, format: uuid }

    OperatorPinResponse:
      type: object
      properties:
        accessToken:       { type: string }
        refreshToken:      { type: string }
        tokenType:         { type: string, example: Bearer }
        expiresIn:         { type: integer, example: 3600 }
        refreshExpiresIn:  { type: integer, example: 604800 }
        user:
          type: object
          properties:
            id:           { type: string, format: uuid }
            email:        { type: string, format: email }
            displayName:  { type: string }
            type:         { type: string, enum: [INTERNAL, CUSTOMER, PARTNER, SERVICE_ACCOUNT] }
            roles:        { type: array, items: { type: string } }
        customers:
          type: array
          description: QR-enabled customers the operator has access to
          items: { $ref: '#/components/schemas/Customer' }

    # ---- Customer opt-in (carried over from QR Checker) ----------------------
    WoCustomerSettings:
      type: object
      properties:
        customerId:         { type: string, format: uuid }
        tenantId:           { type: string, format: uuid }
        viewerPasswordHash: { type: string, nullable: true }
        defaultCentralId:   { type: string, format: uuid, nullable: true }
        woMetadata:        { type: object, additionalProperties: true }
        createdBy:          { type: string, format: uuid }
        createdAt:          { type: string, format: date-time }
        updatedAt:          { type: string, format: date-time }

    EnableWoCustomerRequest:
      type: object
      properties:
        defaultCentralId: { type: string, format: uuid, nullable: true }
        viewerPassword:   { type: string, nullable: true, minLength: 4 }
        woMetadata:      { type: object, additionalProperties: true }

    UpdateWoCustomerSettingsRequest:
      $ref: '#/components/schemas/EnableWoCustomerRequest'

    ViewerLoginRequest:
      type: object
      required: [password]
      properties:
        password: { type: string }

    ViewerLoginResponse:
      type: object
      properties:
        accessToken: { type: string }
        tokenType:   { type: string, example: Bearer }
        expiresIn:   { type: integer, example: 3600 }
        customer:    { $ref: '#/components/schemas/Customer' }

    # =========================================================================
    # RFC-0037 - Work Orders (event model) schemas
    # =========================================================================
    ActorSnapshot:
      type: object
      description: Immutable id/email/name actor snapshot (survives user deletion).
      properties:
        id:    { type: string, format: uuid, nullable: true }
        email: { type: string, nullable: true }
        name:  { type: string, nullable: true }

    WorkOrder:
      type: object
      properties:
        id:          { type: string, format: uuid }
        tenantId:    { type: string, format: uuid }
        customerId:  { type: string, format: uuid }
        rootAssetId: { type: string, format: uuid, nullable: true }
        type:        { type: string, enum: [INSTALACAO, MANUTENCAO, VISITA_TECNICA] }
        status:
          type: string
          description: Projection of the latest lifecycle event.
          enum: [PLANEJADA, EM_ANDAMENTO, INTERROMPIDA, AGUARDANDO, REAGENDADA, FINALIZADA, CANCELADA]
        code:        { type: string, nullable: true }
        assignedTo:  { type: string, format: uuid, nullable: true }
        scheduledAt: { type: string, format: date-time, nullable: true }
        createdBy:   { type: string, format: uuid }
        createdAt:   { type: string, format: date-time }
        updatedAt:   { type: string, format: date-time }

    WorkOrderDetail:
      allOf:
        - $ref: '#/components/schemas/WorkOrder'
        - type: object
          properties:
            devices: { type: array, items: { $ref: '#/components/schemas/WorkOrderDevice' } }
            events:  { type: array, items: { $ref: '#/components/schemas/WorkOrderEvent' } }

    WorkOrderDevice:
      type: object
      properties:
        workOrderId: { type: string, format: uuid }
        deviceId:    { type: string, format: uuid }
        addedBy:     { type: string, format: uuid }
        addedAt:     { type: string, format: date-time }

    WorkOrderEvent:
      type: object
      properties:
        id:            { type: string, format: uuid }
        tenantId:      { type: string, format: uuid }
        workOrderId:   { type: string, format: uuid }
        eventType:     { type: string, description: 'A code from work_orders_event_types (e.g. VISITA_TECNICA_INICIADA, AMBIENTE_CRIADO, OBSERVACAO_INSERIDA).' }
        actorType:     { type: string, enum: [USER, SYSTEM, API_KEY] }
        actorUserId:   { type: string, format: uuid, nullable: true }
        actor:         { allOf: [ { $ref: '#/components/schemas/ActorSnapshot' } ], nullable: true }
        assetId:       { type: string, format: uuid, nullable: true }
        deviceId:      { type: string, format: uuid, nullable: true }
        payload:       { type: object, additionalProperties: true }
        createdAt:     { type: string, format: date-time }

    WorkOrderFile:
      type: object
      properties:
        id:               { type: string, format: uuid }
        workOrderId:      { type: string, format: uuid }
        workOrderEventId: { type: string, format: uuid, nullable: true }
        fileAssetId:      { type: string, format: uuid }
        imageOrder:       { type: integer }
        caption:          { type: string, nullable: true }
        createdAt:        { type: string, format: date-time }

    CreateWorkOrderRequest:
      type: object
      required: [customerId, type]
      properties:
        customerId:  { type: string, format: uuid }
        type:        { type: string, enum: [INSTALACAO, MANUTENCAO, VISITA_TECNICA] }
        rootAssetId: { type: string, format: uuid, nullable: true }
        code:        { type: string, nullable: true }
        assignedTo:  { type: string, format: uuid, nullable: true }
        scheduledAt: { type: string, format: date-time, nullable: true }
        devices:
          type: array
          items: { type: string, format: uuid }
          description: Optional initial device scope.

    UpdateWorkOrderRequest:
      type: object
      properties:
        rootAssetId: { type: string, format: uuid, nullable: true }
        code:        { type: string, nullable: true }
        assignedTo:  { type: string, format: uuid, nullable: true }
        scheduledAt: { type: string, format: date-time, nullable: true }

    AppendWorkOrderEventRequest:
      type: object
      required: [eventType]
      properties:
        eventType: { type: string, description: 'Event-type code from the catalog.' }
        assetId:   { type: string, format: uuid, nullable: true }
        deviceId:  { type: string, format: uuid, nullable: true }
        payload:   { type: object, additionalProperties: true }

    AddWorkOrderDeviceRequest:
      type: object
      required: [deviceId]
      properties:
        deviceId: { type: string, format: uuid }

    AddWorkOrderFileRequest:
      type: object
      required: [fileAssetId]
      properties:
        fileAssetId:      { type: string, format: uuid }
        workOrderEventId: { type: string, format: uuid, nullable: true }
        imageOrder:       { type: integer, default: 0 }
        caption:          { type: string, nullable: true }

    # =========================================================================
    # RFC-0036 - Annotations (polymorphic) schemas
    # =========================================================================
    Annotation:
      type: object
      properties:
        id:              { type: string, format: uuid }
        tenantId:        { type: string, format: uuid }
        customerId:      { type: string, format: uuid }
        entityType:      { type: string, enum: [device, work_order, work_order_event] }
        entityId:        { type: string, format: uuid }
        text:            { type: string, maxLength: 255 }
        type:            { type: string, enum: [observation, pending, maintenance, activity] }
        importance:      { type: integer, minimum: 1, maximum: 5 }
        status:          { type: string, enum: [created, modified, archived] }
        finalized:       { type: boolean }
        finalizedReason: { type: string, enum: [approved, rejected, archived], nullable: true }
        dueDate:         { type: string, format: date-time, nullable: true }
        createdBy:       { $ref: '#/components/schemas/ActorSnapshot' }
        updatedBy:       { allOf: [ { $ref: '#/components/schemas/ActorSnapshot' } ], nullable: true }
        version:         { type: integer }
        createdAt:       { type: string, format: date-time }
        updatedAt:       { type: string, format: date-time }

    AnnotationDetail:
      allOf:
        - $ref: '#/components/schemas/Annotation'
        - type: object
          properties:
            responses:   { type: array, items: { $ref: '#/components/schemas/AnnotationResponse' } }
            events:      { type: array, items: { $ref: '#/components/schemas/AnnotationEvent' } }
            mentions:    { type: array, items: { $ref: '#/components/schemas/AnnotationMention' } }
            attachments: { type: array, items: { $ref: '#/components/schemas/AnnotationAttachment' } }

    AnnotationResponse:
      type: object
      properties:
        id:            { type: string, format: uuid }
        annotationId:  { type: string, format: uuid }
        type:          { type: string, enum: [approved, rejected, comment, archived] }
        text:          { type: string, nullable: true, maxLength: 255 }
        createdBy:     { $ref: '#/components/schemas/ActorSnapshot' }
        createdAt:     { type: string, format: date-time }

    AnnotationEvent:
      type: object
      properties:
        id:              { type: string, format: uuid }
        annotationId:    { type: string, format: uuid }
        responseId:      { type: string, format: uuid, nullable: true }
        action:          { type: string, enum: [created, modified, archived, approved, rejected, commented, acknowledged] }
        previousVersion: { type: integer, nullable: true }
        changes:         { type: object, additionalProperties: true, nullable: true }
        actor:           { $ref: '#/components/schemas/ActorSnapshot' }
        createdAt:       { type: string, format: date-time }

    AnnotationMention:
      type: object
      properties:
        id:                { type: string, format: uuid }
        annotationId:      { type: string, format: uuid }
        responseId:        { type: string, format: uuid, nullable: true }
        mentionType:       { type: string, enum: [user, device] }
        mentionedUserId:   { type: string, format: uuid, nullable: true }
        mentionedDeviceId: { type: string, format: uuid, nullable: true }
        actor:             { $ref: '#/components/schemas/ActorSnapshot' }
        createdAt:         { type: string, format: date-time }

    AnnotationAttachment:
      type: object
      properties:
        id:            { type: string, format: uuid }
        annotationId:  { type: string, format: uuid }
        responseId:    { type: string, format: uuid, nullable: true }
        fileAssetId:   { type: string, format: uuid }
        createdBy:     { $ref: '#/components/schemas/ActorSnapshot' }
        createdAt:     { type: string, format: date-time }

    CreateAnnotationRequest:
      type: object
      required: [entityType, entityId, customerId, text]
      properties:
        entityType: { type: string, enum: [device, work_order, work_order_event] }
        entityId:   { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        text:       { type: string, maxLength: 255 }
        type:       { type: string, enum: [observation, pending, maintenance, activity], default: observation }
        importance: { type: integer, minimum: 1, maximum: 5, default: 3 }
        dueDate:    { type: string, format: date-time, nullable: true }
        mentions:
          type: array
          items: { $ref: '#/components/schemas/CreateMentionRequest' }

    UpdateAnnotationRequest:
      type: object
      properties:
        text:       { type: string, maxLength: 255 }
        type:       { type: string, enum: [observation, pending, maintenance, activity] }
        importance: { type: integer, minimum: 1, maximum: 5 }
        dueDate:    { type: string, format: date-time, nullable: true }
        version:    { type: integer, description: 'Expected version for optimistic lock (or use If-Match).' }

    CreateResponseRequest:
      type: object
      required: [type]
      properties:
        type:    { type: string, enum: [approved, rejected, comment, archived] }
        text:    { type: string, maxLength: 255, description: 'Required for all types except approved.' }
        version: { type: integer }

    CreateMentionRequest:
      type: object
      required: [mentionType]
      properties:
        mentionType:       { type: string, enum: [user, device] }
        mentionedUserId:   { type: string, format: uuid, nullable: true }
        mentionedDeviceId: { type: string, format: uuid, nullable: true }
        responseId:        { type: string, format: uuid, nullable: true }

    CreateAttachmentRequest:
      type: object
      required: [fileAssetId]
      properties:
        fileAssetId: { type: string, format: uuid }
        responseId:  { type: string, format: uuid, nullable: true }

    SetOperatorPinRequest:
      type: object
      required: [pin]
      properties:
        pin: { type: string, pattern: '^\d{4}$', nullable: true, description: 'Pass null to clear PIN' }

    # ── RFC-0046 Consumption Goals ─────────────────────────────────────────────
    GoalHistoryEntry:
      type: object
      description: One audit row — one per operation (a mutation = a version = one entry).
      properties:
        source:        { type: string, enum: [IMPORT, REPLACE, MERGE, DELETE, EDIT, MARGIN] }
        actionLevel:   { type: string, enum: [YEAR, MONTH, DAY, HOUR], description: Coarsest level the operation touched }
        bucketRef:     { type: string, description: 'Representative ref (the single bucket, else the year)' }
        oldValue:      { type: number, nullable: true }
        newValue:      { type: number, nullable: true }
        bucketCount:   { type: integer, description: How many operator buckets the operation carried }
        details:       { type: array, description: 'Compact sample (server-capped at 50)', items: { type: object, properties: { ref: { type: string }, value: { type: number } } } }
        distributed:   { type: boolean, description: 'true = system spread to hours' }
        hoursAffected: { type: integer }
        version:       { type: integer, description: The version this operation produced }
        actor:         { type: string, format: uuid, nullable: true }
        changedAt:     { type: string, format: date-time }

    SingleDashboard:
      type: object
      description: |
        RFC-0053 aggregated snapshot. `groups[].devices[].telemetry` and
        `goals[].monthConsumption` stay null while the ingestion read-through
        is pending; consumers must treat every telemetry-derived field as
        optional. See docs/rfcs/RFC-0053-One-Store-Dashboard.md for the full
        contract.
      additionalProperties: true
      properties:
        customerId:   { type: string, format: uuid }
        customerName: { type: string }
        groups:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              key:         { type: string, enum: [energy, water, temperature] }
              deviceCount: { type: integer }
              online:      { type: integer }
              offline:     { type: integer }
              telemetry:
                type: object
                properties:
                  available: { type: boolean }
                  reason:    { type: string }
        unassigned: { type: array, items: { type: object, additionalProperties: true } }
        health:
          type: object
          properties:
            score:      { type: integer, minimum: 0, maximum: 100 }
            components: { type: array, items: { type: object, additionalProperties: true } }
        goals:    { type: array, items: { type: object, additionalProperties: true } }
        insights: { type: array, items: { type: object, additionalProperties: true } }
        errors:   { type: array, items: { type: object, properties: { section: { type: string }, message: { type: string } } } }

    GoalTree:
      type: object
      description: |
        Resolved goal for one (customer, domain, year). The hour is the only stored
        grain; year/month/day views are rolled up on read (SUM domains) or weighted-
        averaged (TEMPERATURE), and every node declares its `method`. The nested tree
        fields are passed through — see RFC-0046-Goals-API.md §2 for the full shape.
        RFC-0052: every tree node also carries `adjustedValue` (= value with the
        margin overlay applied; equal to `value` when no margin is set) and the
        response carries the `goalMargin` block (null when never set).
      additionalProperties: true
      properties:
        goalMargin:
          type: object
          nullable: true
          description: 'RFC-0052 margin overlay; null when no margin was ever set.'
          properties:
            goalMarginPct: { type: number, minimum: -100, maximum: 100, example: -5 }
            updatedBy:     { type: string, format: uuid, nullable: true }
            updatedAt:     { type: string, format: date-time, nullable: true }
        domain:  { type: string, enum: [ENERGY, WATER, TEMPERATURE] }
        year:    { type: integer, example: 2026 }
        unit:    { type: string, example: kWh, description: 'kWh | m3 | C — fixed per domain' }
        method:  { type: string, enum: [SUM, AVERAGE] }
        version: { type: integer, description: Optimistic version (increments on every change) }
        total:   { type: number, nullable: true }
        source:  { type: string, example: customer }
        history:
          type: array
          description: 'Present when ?fetchHistory=true (≤100, newest-first).'
          items: { $ref: '#/components/schemas/GoalHistoryEntry' }

    GoalsWriteResult:
      type: object
      description: 'Write outcome. The new version is also returned in the `X-Version-Id` response header. See RFC-0046-Goals-API.md for exact fields.'
      additionalProperties: true
      properties:
        version: { type: integer }
        source:  { type: string, example: customer }

    GoalReplaceBucket:
      type: object
      required: [value]
      properties:
        value:       { type: number, description: '>= 0 for ENERGY/WATER; TEMPERATURE may be negative' }
        sourceLevel: { type: string, enum: [YEAR, MONTH, DAY, HOUR], nullable: true }

    GoalReplaceDayNode:
      type: object
      properties:
        value: { type: number }
        hourly:
          type: object
          description: 'Map of "00".."23" → bucket.'
          additionalProperties: { $ref: '#/components/schemas/GoalReplaceBucket' }

    GoalReplaceMonthNode:
      type: object
      properties:
        value: { type: number }
        daily:
          type: object
          description: 'Map of "01".."31" → day node.'
          additionalProperties: { $ref: '#/components/schemas/GoalReplaceDayNode' }

    GoalsReplaceBody:
      type: object
      description: 'PUT (replace) — at least `annual` or one month must be present. Buckets absent from the scope are removed; values distribute to the hourly grain.'
      properties:
        annual: { $ref: '#/components/schemas/GoalReplaceBucket' }
        monthly:
          type: object
          description: 'Map of "01".."12" → month node.'
          additionalProperties: { $ref: '#/components/schemas/GoalReplaceMonthNode' }
        expectedVersion: { type: integer, description: 'Optimistic guard → 409 on mismatch' }

    GoalsMergeBody:
      type: object
      description: 'PATCH (merge) — only the named buckets are (re)distributed; everything else preserved.'
      required: [buckets]
      properties:
        buckets:
          type: array
          minItems: 1
          maxItems: 8760
          items:
            type: object
            required: [ref, value]
            properties:
              ref:   { type: string, minLength: 4, maxLength: 13, description: 'Bucket ref: 2026 | 2026-03 | 2026-03-15 | 2026-03-15T08' }
              value: { type: number }
        expectedVersion: { type: integer }

    GoalsImportBody:
      type: object
      required: [csv]
      properties:
        csv:             { type: string, description: 'CSV text (ref,value rows). Merge/PATCH semantics, stateless.' }
        expectedVersion: { type: integer }

    GoalsDeleteBody:
      type: object
      description: 'Optional DELETE body — an optimistic guard and/or a single sub-bucket to delete (omit `bucket` to delete the whole domain/year).'
      properties:
        bucket:
          type: object
          properties:
            ref: { type: string, minLength: 4, maxLength: 13 }
        expectedVersion: { type: integer }
        mode:
          type: string
          enum: [redistribute, shrink-total]
          description: 'Addendum A (DEC-12): removing an EXPLICIT meter''s goal redistributes its share to the RESIDUAL meters; with none left, `shrink-total` must be stated or the call answers 409 GOAL_REMOVAL_MODE_REQUIRED.'

paths:
  # Health
  /health:
    get:
      tags:
        - Health
      summary: Health check
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/HealthStatus'

  # Authentication
  /auth/login:
    post:
      tags: [Authentication]
      summary: User login
      description: |
        Authenticates a user with email and password.

        If MFA is enabled for the user, returns a temporary MFA token instead of access tokens.
        The client must then call `/auth/mfa/verify` to complete authentication.
      operationId: authLogin
      security: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful (or MFA required)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/LoginResponse'
                  - $ref: '#/components/schemas/MfaRequiredResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Refresh access token
      description: |
        Exchanges a valid refresh token for new access and refresh tokens.
        The old refresh token is invalidated.
      operationId: authRefresh
      security: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Tokens refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/mfa/verify:
    post:
      tags: [Authentication]
      summary: Verify MFA code
      description: |
        Completes the MFA verification step after login.
        Requires the temporary MFA token from the login response.
      operationId: authMfaVerify
      security: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaVerifyRequest'
      responses:
        '200':
          description: MFA verified, tokens issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid MFA code or token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/logout:
    post:
      tags: [Authentication]
      summary: Logout user
      description: |
        Invalidates the current session.
        Optionally invalidates all sessions for the user.
      operationId: authLogout
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessageResponse'

  /auth/me:
    get:
      tags: [Authentication]
      summary: Get enriched authz snapshot for the authenticated user
      description: |
        Single hydrate endpoint intended to replace the chain
        `/users/me` + `/authorization/users/:id/roles` + policy lookups.

        Returns the authenticated user plus every **active** role assignment
        with the role expanded and each role's policies fully loaded
        (`allow`, `deny`, `conditions`), plus the flat `effectivePermissions`
        and `deniedPatterns` views.

        Input: `Authorization: Bearer <jwt>` only. `tenantId` and `userId` are
        extracted from the JWT claims.

        Cost on the backend: 3 queries (assignments, roles by keys,
        policies by keys).

        Orphan assignments (when the referenced role was deleted) surface
        with `role: null` instead of erroring out.
      operationId: authMe
      responses:
        '200':
          description: Enriched snapshot
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthMeResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/password/forgot:
    post:
      tags: [Authentication]
      summary: Request password reset
      description: |
        Sends a password reset email to the user.
        Always returns success to prevent email enumeration.
      operationId: authForgotPassword
      security: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '200':
          description: Password reset email sent (if user exists)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessageResponse'

  /auth/forgot-password:
    post:
      tags: [Authentication]
      summary: Request password reset (RFC-0011)
      description: |
        Sends a 6-digit verification code to the user's email.
        Code expires in 15 minutes. Always returns success to prevent email enumeration.
      operationId: authForgotPasswordV2
      security: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Reset code sent (if user exists)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessageResponse'

  /auth/reset-password:
    post:
      tags: [Authentication]
      summary: Reset password with 6-digit code (RFC-0011)
      description: |
        Resets the user password using a 6-digit code received via email.
        If the account was locked, it will be automatically unlocked.
      operationId: authResetPasswordV2
      security: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code, newPassword]
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
                  pattern: '^\d{6}$'
                  example: '123456'
                newPassword:
                  type: string
                  minLength: 8
      responses:
        '200':
          description: Password reset successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                      unlocked:
                        type: boolean
        '401':
          description: Invalid or expired code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # RFC-0011: User Registration
  /auth/register:
    post:
      tags: [Registration]
      summary: Self-service user registration
      description: |
        Creates a new user account with UNVERIFIED status.
        A 6-digit verification code is sent to the email (valid for 15 minutes).
      operationId: authRegister
      security: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, firstName, lastName]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                  description: Min 8 chars, 1 uppercase, 1 lowercase, 1 number, 1 special char
                firstName:
                  type: string
                  minLength: 2
                lastName:
                  type: string
                  minLength: 2
                phone:
                  type: string
                customerId:
                  type: string
                  format: uuid
      responses:
        '201':
          description: User created, verification code sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      userId:
                        type: string
                        format: uuid
                      email:
                        type: string
                      status:
                        type: string
                        enum: [UNVERIFIED]
                      message:
                        type: string
                      expiresIn:
                        type: integer
                        description: Code expiry in seconds
        '400':
          description: Validation error or email already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/verify-email:
    post:
      tags: [Registration]
      summary: Verify email with 6-digit code
      description: |
        Verifies the user's email address using the 6-digit code sent during registration.
        On success, user status changes from UNVERIFIED to PENDING_APPROVAL.
      operationId: authVerifyEmail
      security: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
                  pattern: '^\d{6}$'
                  example: '123456'
      responses:
        '200':
          description: Email verified, awaiting approval
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        enum: [PENDING_APPROVAL]
                      message:
                        type: string
        '401':
          description: Invalid or expired code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/resend-verification:
    post:
      tags: [Registration]
      summary: Resend verification code
      description: |
        Resends the 6-digit verification code to the user's email.
        Rate limited to 3 resends per hour.
      operationId: authResendVerification
      security: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Code resent (if user exists and is unverified)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessageResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # RFC-0011: Admin User Management
  /admin/users/pending-approval:
    get:
      tags: [Admin Users]
      summary: List users pending approval
      description: Returns all users with PENDING_APPROVAL status
      operationId: adminListPendingApproval
