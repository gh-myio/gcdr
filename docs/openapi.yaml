    get:
      tags: [Rules]
      summary: List devices associated to a rule
      description: |
        Returns all devices referenced by the rule's scope (`scope_entity_id` and/or `scope_entity_ids`).
        Only applies to rules with `scope.type = DEVICE`.
      operationId: listRuleDevices
      parameters:
