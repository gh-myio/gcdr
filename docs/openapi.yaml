          description: Group or channel not found

  # Group Dispatch Matrix — channel × action × delay (RFC-0024)
  /groups/{groupId}/dispatch:
    get:
      tags: [Groups]
      summary: Get group dispatch matrix
      description: Returns all (channel × action) entries configured for a group, including escalation delay.
      operationId: getGroupDispatch
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: groupId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Dispatch matrix
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/GroupDispatchEntry'
                          count:
                            type: integer
    put:
      tags: [Groups]
      summary: Replace group dispatch matrix
      description: Idempotent full replace of all (channel × action) entries.
      operationId: putGroupDispatch
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: groupId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entries]
              properties:
                entries:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [channel, action, active]
                    properties:
                      channel:
                        type: string
                        enum: [EMAIL, TELEGRAM, WHATSAPP, WEBHOOK, SLACK, SMS, TEAMS, CUSTOM]
                      action:
                        type: string
                        enum: [OPEN, ACK, ESCALATE, SNOOZE, CLOSE, STATE_HISTORY]
                      active:
                        type: boolean
                      escalationDelayMs:
                        type: integer
                        minimum: 0
                        default: 0
            examples:
              basic:
                summary: EMAIL + TELEGRAM for OPEN/CLOSE, TELEGRAM with 5s delay on ESCALATE
                value:
                  entries:
                    - { channel: EMAIL,    action: OPEN,     active: true, escalationDelayMs: 0 }
                    - { channel: EMAIL,    action: CLOSE,    active: true, escalationDelayMs: 0 }
                    - { channel: TELEGRAM, action: OPEN,     active: true, escalationDelayMs: 0 }
                    - { channel: TELEGRAM, action: CLOSE,    active: true, escalationDelayMs: 0 }
                    - { channel: TELEGRAM, action: ESCALATE, active: true, escalationDelayMs: 5000 }
      responses:
        '200':
          description: Dispatch matrix replaced
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/GroupDispatchEntry'
                          count:
                            type: integer
    patch:
      tags: [Groups]
      summary: Partially update dispatch matrix entries
      operationId: patchGroupDispatch
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: groupId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entries]
              properties:
                entries:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [channel, action, active]
                    properties:
                      channel:
                        type: string
                      action:
                        type: string
                        enum: [OPEN, ACK, ESCALATE, SNOOZE, CLOSE, STATE_HISTORY]
                      active:
                        type: boolean
                      escalationDelayMs:
                        type: integer
                        minimum: 0
                        default: 0
      responses:
        '200':
          description: Updated entries
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/GroupDispatchEntry'
                          count:
                            type: integer

