      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: a
        required: true
        schema: { type: integer, minimum: 1 }
      - in: path
        name: b
        required: true
        schema: { type: integer, minimum: 1 }
    get:
