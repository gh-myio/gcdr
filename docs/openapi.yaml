      responses:
        '200':
          description: Contacts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/UserContact' }
                          count: { type: integer }
    post:
      tags: [User Contacts]
      summary: Add a notification contact to a user
      operationId: createUserContact
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
