        '204': { description: Unlinked }

  # ===========================================================================
  # RFC-0036 - Annotations (polymorphic: device | work_order | work_order_event)
  # ===========================================================================

  /annotations:
    get:
      tags: [Annotations]
      summary: List annotations (cross-entity)
      description: |
        Filters: `entityType` + `entityId` (e.g. all observations on a work
        order or a single event), `customerId`, `type`, `status`, `importance`,
        `mentionedUserId`, `mentionedDeviceId`, `hasAttachments`,
        `includeArchived`, plus pagination.
      operationId: listAnnotations
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - { in: query, name: entityType, schema: { type: string, enum: [device, work_order, work_order_event] } }
        - { in: query, name: entityId, schema: { type: string, format: uuid } }
        - { in: query, name: customerId, schema: { type: string, format: uuid } }
        - { in: query, name: type, schema: { type: string, enum: [observation, pending, maintenance, activity] } }
        - { in: query, name: status, schema: { type: string, enum: [created, modified, archived] } }
        - { in: query, name: importance, schema: { type: integer, minimum: 1, maximum: 5 } }
        - { in: query, name: mentionedUserId, schema: { type: string, format: uuid } }
        - { in: query, name: mentionedDeviceId, schema: { type: string, format: uuid } }
        - { in: query, name: hasAttachments, schema: { type: boolean } }
        - { in: query, name: includeArchived, schema: { type: boolean } }
      responses:
        '200':
          description: Annotations
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items: { type: array, items: { $ref: '#/components/schemas/Annotation' } }
                          pagination: { $ref: '#/components/schemas/Pagination' }
    post:
      tags: [Annotations]
      summary: Create an annotation on a polymorphic target
      operationId: createAnnotation
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAnnotationRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AnnotationDetail' }

  /annotations/{id}:
    get:
      tags: [Annotations]
      summary: Full annotation (responses + events + mentions + attachments)
      operationId: getAnnotation
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Annotation
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AnnotationDetail' }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    patch:
      tags: [Annotations]
      summary: Edit text/type/importance/dueDate (optimistic lock)
      description: Send the expected version via the `version` body field or the `If-Match` header. A mismatch returns 409.
      operationId: updateAnnotation
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - { in: header, name: If-Match, schema: { type: string }, description: Expected version (optimistic lock). }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAnnotationRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AnnotationDetail' }
        '409': { description: Version conflict (optimistic lock), content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /annotations/{id}/archive:
    post:
      tags: [Annotations]
      summary: Archive an annotation (finalizes it)
      operationId: archiveAnnotation
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - { in: header, name: If-Match, schema: { type: string } }
      responses:
        '200':
          description: Archived
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AnnotationDetail' }
        '409': { description: Already finalized or version conflict, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /annotations/{id}/responses:
    post:
      tags: [Annotations]
      summary: Add a comment or finalizing decision
      description: comment does not finalize; approved/rejected/archived finalize the annotation.
      operationId: addAnnotationResponse
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateResponseRequest' }
      responses:
        '201':
          description: Response added
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AnnotationResponse' }
        '409': { description: Annotation already finalized, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /annotations/{id}/mentions:
    post:
      tags: [Annotations]
      summary: Mention a user or device
      operationId: addAnnotationMention
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMentionRequest' }
      responses:
        '201':
          description: Mention added
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AnnotationMention' }

  /annotations/{id}/attachments:
    post:
      tags: [Annotations]
      summary: Attach a file (links an existing fileAssetId)
      operationId: addAnnotationAttachment
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAttachmentRequest' }
      responses:
        '201':
          description: Attached
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AnnotationAttachment' }

  /annotations/{id}/attachments/{attId}:
    delete:
      tags: [Annotations]
      summary: Detach a file (active annotation only)
      operationId: removeAnnotationAttachment
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: attId, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Detached }
