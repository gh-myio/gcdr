                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/Group'
        '404':
          description: Group not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # Group Channels — per-group routing targets (RFC-0024)
  /groups/{groupId}/channels:
    get:
      tags: [Groups]
      summary: List group channel targets
      description: Returns all configured channel targets for a group (chat_id, email, webhook URL, etc.)
      operationId: listGroupChannels
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: groupId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Group channels
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/GroupChannel'
                          count:
                            type: integer
        '404':
          description: Group not found
    put:
      tags: [Groups]
      summary: Replace all group channel targets
      description: Idempotent full replace — deletes all existing channels and inserts the new set.
      operationId: putGroupChannels
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: groupId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channels]
              properties:
                channels:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [channel, target]
                    properties:
                      channel:
                        type: string
                        enum: [EMAIL, TELEGRAM, WHATSAPP, WEBHOOK, SLACK, SMS, TEAMS, CUSTOM]
                      active:
                        type: boolean
                        default: true
                      target:
                        type: string
                        example: '-100123456789'
                      config:
                        type: object
                        additionalProperties: true
            examples:
              telegram_email:
                summary: Telegram group + email alias
                value:
                  channels:
                    - channel: TELEGRAM
                      active: true
                      target: '-100123456789'
                    - channel: EMAIL
                      active: true
                      target: 'manut-escadas@mestrealvaro.com.br'
      responses:
        '200':
          description: Channels replaced
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/GroupChannel'
                          count:
                            type: integer

  /groups/{groupId}/channels/{channel}:
    patch:
      tags: [Groups]
      summary: Update a single group channel
      operationId: patchGroupChannel
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: groupId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: channel
          in: path
          required: true
          schema:
            type: string
            example: TELEGRAM
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                active:
                  type: boolean
                target:
                  type: string
                config:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: Channel updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/GroupChannel'
        '404':
          description: Group or channel not found
    delete:
      tags: [Groups]
      summary: Remove a channel from a group
      operationId: deleteGroupChannel
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: groupId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: channel
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Channel removed
        '404':
          description: Group or channel not found

  # Group Dispatch Matrix — channel × action × delay (RFC-0024)
  /groups/{groupId}/dispatch:
    get:
      tags: [Groups]
      summary: Get group dispatch matrix
      description: Returns all (channel × action) entries configured for a group, including escalation delay.
      operationId: getGroupDispatch
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: groupId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Dispatch matrix
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/GroupDispatchEntry'
                          count:
                            type: integer
    put:
      tags: [Groups]
      summary: Replace group dispatch matrix
      description: Idempotent full replace of all (channel × action) entries.
      operationId: putGroupDispatch
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: groupId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entries]
              properties:
                entries:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [channel, action, active]
                    properties:
                      channel:
                        type: string
                        enum: [EMAIL, TELEGRAM, WHATSAPP, WEBHOOK, SLACK, SMS, TEAMS, CUSTOM]
                      action:
                        type: string
                        enum: [OPEN, ACK, ESCALATE, SNOOZE, CLOSE, STATE_HISTORY]
                      active:
                        type: boolean
                      escalationDelayMs:
                        type: integer
                        minimum: 0
                        default: 0
            examples:
              basic:
                summary: EMAIL + TELEGRAM for OPEN/CLOSE, TELEGRAM with 5s delay on ESCALATE
                value:
                  entries:
                    - { channel: EMAIL,    action: OPEN,     active: true, escalationDelayMs: 0 }
                    - { channel: EMAIL,    action: CLOSE,    active: true, escalationDelayMs: 0 }
                    - { channel: TELEGRAM, action: OPEN,     active: true, escalationDelayMs: 0 }
                    - { channel: TELEGRAM, action: CLOSE,    active: true, escalationDelayMs: 0 }
                    - { channel: TELEGRAM, action: ESCALATE, active: true, escalationDelayMs: 5000 }
      responses:
        '200':
          description: Dispatch matrix replaced
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/GroupDispatchEntry'
                          count:
                            type: integer
    patch:
      tags: [Groups]
      summary: Partially update dispatch matrix entries
      operationId: patchGroupDispatch
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: groupId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entries]
              properties:
                entries:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [channel, action, active]
                    properties:
                      channel:
                        type: string
                      action:
                        type: string
                        enum: [OPEN, ACK, ESCALATE, SNOOZE, CLOSE, STATE_HISTORY]
                      active:
                        type: boolean
                      escalationDelayMs:
                        type: integer
                        minimum: 0
                        default: 0
      responses:
        '200':
          description: Updated entries
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/GroupDispatchEntry'
                          count:
                            type: integer

  # Templates (RFC-0021)
  /templates:
    post:
      tags: [Templates]
      summary: Create a new HTML template
      operationId: createTemplate
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTemplate'
      responses:
        '201':
          description: Template created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/Template'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Slug already exists for this tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags: [Templates]
      summary: List templates (without htmlContent)
      operationId: listTemplates
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: type
          in: query
          description: Filter by template type
          schema:
            type: string
            enum: [EMAIL_ALARM, EMAIL_REPORT, EMAIL_WELCOME, RELEASE_NOTE, NOTIFICATION, INSIGHT]
        - name: status
          in: query
          description: Filter by status
          schema:
            type: string
            enum: [DRAFT, ACTIVE, ARCHIVED]
      responses:
        '200':
          description: List of templates (summary, no htmlContent)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/TemplateSummary'

  /templates/render:
    get:
      tags: [Templates]
      summary: Get template HTML merged with customer theme (EMAIL_SENDER M2M)
      description: >
        Resolves template and theme using the customer hierarchy.
        Template resolution: customer → parent chain → tenant default.
        Theme resolution: customer+type → customer default → parent default → tenant MYIO.
        Returns HTML with CSS variables injected, ready for {{tag}} substitution by the caller.
      operationId: renderTemplateGet
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: type
          in: query
          required: true
          schema:
            type: string
            enum: [EMAIL_ALARM, EMAIL_REPORT, EMAIL_WELCOME, RELEASE_NOTE, NOTIFICATION, INSIGHT]
        - name: customerId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: version
          in: query
          required: false
          description: Specific template version. Omit to use latest ACTIVE.
          schema:
            type: integer
      responses:
        '200':
          description: Template HTML with theme injected
          headers:
            X-Template-Version:
              schema:
                type: integer
            X-Template-Source:
              schema:
                type: string
                enum: [customer, parent_customer, tenant]
            X-Theme-Source:
              schema:
                type: string
                enum: [customer_type, customer_default, parent_default, tenant]
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/TemplateRenderResult'
        '404':
          description: No ACTIVE template found for type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [Templates]
      summary: Full render — theme injection + data substitution in one call (EMAIL_SENDER)
      operationId: renderTemplateFull
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, customerId, data]
              properties:
                type:
                  type: string
                  enum: [EMAIL_ALARM, EMAIL_REPORT, EMAIL_WELCOME, RELEASE_NOTE, NOTIFICATION, INSIGHT]
                customerId:
                  type: string
                  format: uuid
                version:
                  type: integer
                data:
                  type: object
                  additionalProperties: true
                  description: Template variables (follows EMAIL-SENDER-PAYLOAD-CONTRACT per type)
      responses:
        '200':
          description: Fully rendered HTML with data substituted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/TemplateRenderResult'
        '404':
          description: Template not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

