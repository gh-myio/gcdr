                          items:
                            type: array
                            items: { $ref: '#/components/schemas/WikiBacklink' }

  # ===========================================================================
  # Wiki Public — anonymous (RFC-0030 Phase 2)
  # Forces visibility ⊇ PUBLIC and status = PUBLISHED. No auth required.
  # ===========================================================================

  /api/v1/public/wiki/namespaces:
    get:
      tags: [Wiki Public]
      summary: List namespaces (anonymous-friendly)
      operationId: listPublicWikiNamespaces
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/WikiNamespace' }
                      total: { type: integer }

  /api/v1/public/wiki/pages:
    get:
      tags: [Wiki Public]
      summary: List PUBLIC PUBLISHED pages
      operationId: listPublicWikiPages
      security: []
      parameters:
        - in: query
          name: namespace
          schema: { type: string }
        - in: query
          name: tag
          schema: { type: string }
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, minimum: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/WikiPage' }

  /api/v1/public/wiki/pages/by-slug/{namespace}/{slug}:
    get:
      tags: [Wiki Public]
      summary: Lookup a PUBLIC page by canonical slug
      operationId: getPublicWikiPageBySlug
      security: []
      parameters:
        - in: path
          name: namespace
          required: true
          schema: { type: string }
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/WikiPageWithRevision' }
        '404':
          description: Not found, not PUBLIC, or not PUBLISHED
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }

  /api/v1/public/wiki/pages/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Wiki Public]
      summary: Lookup a PUBLIC page by id
      operationId: getPublicWikiPageById
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/WikiPageWithRevision' }

  /api/v1/public/wiki/search:
    get:
      tags: [Wiki Public]
      summary: Full-text search restricted to PUBLIC PUBLISHED pages
      operationId: searchPublicWikiPages
      security: []
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string, minLength: 1 }
        - in: query
          name: namespace
          schema: { type: string }
        - in: query
          name: tags
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, minimum: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/WikiSearchHit' }

  /api/v1/public/wiki/backlinks:
    get:
      tags: [Wiki Public]
      summary: Public backlinks lookup
      operationId: getPublicWikiBacklinks
      security: []
      parameters:
        - in: query
          name: entity
          required: true
          schema: { type: string, pattern: "^(device|customer|rule|asset|central|group|user|rfc):.+$" }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/WikiBacklink' }

  # ===========================================================================
  # File Assets (RFC-0030 Phase 4 / RFC-0031)
  # ===========================================================================

  /api/v1/files:
    post:
      tags: [File Assets]
      summary: Upload a file (multipart/form-data, field name "file")
      operationId: uploadFileAsset
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                ownerType:
                  $ref: '#/components/schemas/FileAssetOwnerType'
                ownerId:
                  type: string
                  description: Required when ownerType ≠ 'free'
                customerId:
                  type: string
                  format: uuid
                metadata:
                  type: string
                  description: JSON-encoded object (free-form key/value)
                publicSlug:
                  type: string
                  pattern: "^[a-z0-9][a-z0-9/_-]{0,127}$"
                  description: Optional. If set, the asset becomes reachable at /api/v1/public/files/by-slug/<publicSlug>. Returns 409 if slug already taken in the tenant.
              required: [file, ownerType]
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/FileAssetWithDownloadUrl' }
        '400':
          description: Validation error (missing file, oversized, MIME not allowed, invalid metadata, ownerId required, ...)
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    get:
      tags: [File Assets]
      summary: List files with filters
      operationId: listFileAssets
      parameters:
        - in: query
          name: ownerType
          schema: { $ref: '#/components/schemas/FileAssetOwnerType' }
        - in: query
          name: ownerId
          schema: { type: string }
        - in: query
          name: customerId
          schema: { type: string, format: uuid }
        - in: query
          name: status
          schema: { $ref: '#/components/schemas/FileAssetStatus' }
        - in: query
          name: scanStatus
          schema: { $ref: '#/components/schemas/FileAssetScanStatus' }
        - in: query
          name: includeDeleted
          schema: { type: boolean, default: false }
        - in: query
          name: page
          schema: { type: integer, minimum: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/FileAsset' }

  /api/v1/files/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [File Assets]
      summary: Get file metadata
      operationId: getFileAsset
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/FileAsset' }
    delete:
      tags: [File Assets]
      summary: Soft-delete a file (S3 binary purged by lifecycle rule after 30 days)
      operationId: deleteFileAsset
      responses:
        '204': { description: Deleted }

  /api/v1/files/{id}/download:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [File Assets]
      summary: Mint a presigned download URL (or 302 redirect)
      operationId: getFileAssetDownloadUrl
      parameters:
        - in: query
          name: disposition
          schema: { type: string, enum: [inline, attachment], default: inline }
        - in: query
          name: expiresInSeconds
          schema: { type: integer, minimum: 30, maximum: 3600, default: 300 }
        - in: query
          name: filename
          schema: { type: string }
        - in: query
          name: redirect
          schema: { type: boolean, default: false }
          description: When true, the API returns a 302 redirect to the signed URL.
      responses:
        '200':
          description: Signed URL (default JSON mode)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/FileAssetDownloadResponse' }
        '302':
          description: Redirect to signed S3 URL (when ?redirect=true)
          headers:
            Location:
              schema: { type: string, format: uri }
        '400':
          description: Asset is QUARANTINED — downloads blocked
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '404':
          description: Asset not found or soft-deleted
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }

  /api/v1/files/{id}/public-slug:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [File Assets]
      summary: Set, replace, or clear (`null`) the file's public slug
      operationId: setFileAssetPublicSlug
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetPublicSlugRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/FileAsset' }
        '404':
          description: Asset not found
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '409':
          description: Slug already taken by another live asset in this tenant
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }

  /api/v1/public/files/by-slug/{slug}:
    parameters:
      - in: path
        name: slug
        required: true
        schema:
          type: string
          pattern: "^[a-z0-9][a-z0-9/_-]{0,127}$"
        description: Slug may contain `/` (e.g. `device-icons/escada-rolante`)
    get:
      tags: [File Assets]
      summary: Resolve a publicly-named file by its slug — anonymous-friendly
      operationId: getPublicFileBySlug
      security: []
      parameters:
        - in: query
          name: disposition
          schema: { type: string, enum: [inline, attachment], default: inline }
        - in: query
          name: expiresInSeconds
          schema: { type: integer, minimum: 30, maximum: 3600, default: 300 }
        - in: query
          name: filename
          schema: { type: string, maxLength: 256 }
          description: Override the response Content-Disposition filename
        - in: query
          name: redirect
          schema: { type: boolean, default: false }
          description: When true, the API returns a 302 redirect to the signed URL — ideal for `<img src>` and `<a href>`.
      responses:
        '200':
          description: Signed URL JSON (default mode)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/FileAssetDownloadResponse' }
        '302':
          description: Redirect to signed S3 URL (when ?redirect=true)
          headers:
            Location:
              schema: { type: string, format: uri }
        '404':
          description: Slug not registered, asset soft-deleted, or asset QUARANTINED — semantics intentional, no existence leak
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }

  # ===========================================================================
  # RFC-0037 — Work Orders module (operator-pin + viewer-login are public)
  # ===========================================================================

  /auth/operator-pin:
    post:
      tags: [Work Orders, Authentication]
      summary: Field-operator PIN login
      description: |
        Trades a 4-digit PIN + tenantId for a 24h JWT. Field operators on the
        Work Orders mobile UX never see an email form. Two-column credential
        design: HMAC lookup token + bcrypt hash. Rate-limited at 10 attempts
        / 5 min / IP.
      operationId: authOperatorPin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OperatorPinRequest' }
      responses:
        '200':
          description: Login successful — JWT + accessible customers
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/OperatorPinResponse' }
        '401': { description: PIN inválido, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '429':
          description: Rate-limited — 10 attempts / 5 min / IP
          headers:
            Retry-After: { schema: { type: integer }, description: Seconds before next attempt }
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }

  # --- Customers (WO-enabled) ----------------------------------------------

  /wo/customers:
    get:
      tags: [Work Orders]
      summary: List WO-enabled customers
      description: Returns only customers with a `work_orders_customer_settings` row.
      operationId: woListCustomers
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - in: query
          name: include
          schema: { type: string, enum: [stats] }
          description: When `stats`, attaches a `wo` count block to each customer.
      responses:
        '200':
          description: WO-enabled customers
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items: { type: array, items: { $ref: '#/components/schemas/Customer' } }

  /wo/customers/by-code/{code}:
    get:
      tags: [Work Orders]
      summary: Resolve a WO-enabled customer by code (slug)
      operationId: woCustomerByCode
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - in: path
          name: code
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Customer
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Customer' }
        '404': { description: Not found or not WO-enabled, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /wo/customers/{customerId}/enable:
    post:
      tags: [Work Orders]
      summary: Enable Work Orders for a customer
      operationId: woEnableCustomer
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - { in: path, name: customerId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnableWoCustomerRequest' }
      responses:
        '201':
          description: Enabled
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/WoCustomerSettings' }

  /wo/customers/{customerId}/settings:
    patch:
      tags: [Work Orders]
      summary: Update WO settings for a customer
      operationId: woUpdateCustomerSettings
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - { in: path, name: customerId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateWoCustomerSettingsRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/WoCustomerSettings' }

  /wo/customers/{customerId}/disable:
    post:
      tags: [Work Orders]
      summary: Disable Work Orders for a customer (drops settings row)
      operationId: woDisableCustomer
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - { in: path, name: customerId, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Disabled }

  /wo/customers/{customerId}/viewer-login:
    post:
      tags: [Work Orders]
      summary: Viewer password login (PUBLIC)
      description: |
        Trades a viewer password for a short-lived JWT scoped to a single
        customer. No bearer token required — the password authenticates.
      operationId: woViewerLogin
      security: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - { in: path, name: customerId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ViewerLoginRequest' }
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ViewerLoginResponse' }
        '401': { description: Invalid viewer password, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /wo/customers/{customerId}/devices:
    get:
      tags: [Work Orders]
      summary: List devices for a WO-enabled customer
      operationId: woCustomerDevices
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - { in: path, name: customerId, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Devices
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items: { type: array, items: { $ref: '#/components/schemas/Device' } }

  /wo/customers/{customerId}/report:
    get:
      tags: [Work Orders]
      summary: WO summary for a customer (counts by status/type)
      operationId: woCustomerReport
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - { in: path, name: customerId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: format, schema: { type: string, enum: [json], default: json } }
      responses:
        '200':
          description: Summary
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          customerId: { type: string, format: uuid }
                          total:      { type: integer }
                          byStatus:   { type: object, additionalProperties: { type: integer } }
                          byType:     { type: object, additionalProperties: { type: integer } }

  # --- Work orders ----------------------------------------------------------

  /wo/event-types:
    get:
      tags: [Work Orders]
      summary: List the active work-order event-type catalog
      description: >-
        Global, read-only catalog of work-order event types (code, category,
        label, isTerminal, sortOrder). Used by the UI to render the event
        timeline and the "add event" picker. Ordered by sortOrder.
      operationId: woListEventTypes
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Active event types
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            code:       { type: string, example: VISITA_TECNICA_FINALIZADA }
                            category:   { type: string, example: VISITA_TECNICA }
                            label:      { type: string, example: Visita finalizada }
                            isTerminal: { type: boolean }
                            sortOrder:  { type: integer }
                            active:     { type: boolean }
        '401': { description: Unauthorized }
  /wo/work-orders:
    get:
      tags: [Work Orders]
      summary: List work orders
      operationId: woListWorkOrders
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - { in: query, name: customerId, schema: { type: string, format: uuid } }
        - { in: query, name: status, schema: { type: string } }
        - { in: query, name: type, schema: { type: string, enum: [INSTALACAO, MANUTENCAO, VISITA_TECNICA] } }
        - { in: query, name: assignedTo, schema: { type: string, format: uuid } }
        - { in: query, name: deviceId, schema: { type: string, format: uuid } }
        - { in: query, name: limit, schema: { type: integer } }
        - { in: query, name: cursor, schema: { type: string } }
      responses:
        '200':
          description: Work orders
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items: { type: array, items: { $ref: '#/components/schemas/WorkOrder' } }
                          pagination: { $ref: '#/components/schemas/Pagination' }
    post:
      tags: [Work Orders]
      summary: Create a work order
      operationId: woCreateWorkOrder
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateWorkOrderRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/WorkOrderDetail' }

  /wo/work-orders/{id}:
    get:
      tags: [Work Orders]
      summary: Work order detail (status, device scope, events)
      operationId: woGetWorkOrder
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/WorkOrderDetail' }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    patch:
      tags: [Work Orders]
      summary: Update a work order (assignee, schedule, root asset, code)
      operationId: woUpdateWorkOrder
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateWorkOrderRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/WorkOrder' }
    delete:
      tags: [Work Orders]
      summary: Soft-delete a work order
      operationId: woDeleteWorkOrder
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Deleted }

  /wo/work-orders/{id}/events:
    get:
      tags: [Work Orders]
      summary: Work order timeline (events)
      operationId: woListEvents
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Events
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items: { type: array, items: { $ref: '#/components/schemas/WorkOrderEvent' } }
    post:
      tags: [Work Orders]
      summary: Append an event (drives status projection)
      operationId: woAppendEvent
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppendWorkOrderEventRequest' }
      responses:
        '201':
          description: Appended
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/WorkOrderEvent' }
        '409': { description: Work order is terminal (locked), content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /wo/work-orders/{id}/devices:
