                      data:
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/Customer'

  /customers/external/{externalId}:
    get:
      tags: [Customers]
      summary: Get customer by ThingsBoard externalId (enriched)
      operationId: getCustomerByExternalId
      description: |
        Fetches a customer by its ThingsBoard UUID (`externalId`).
        Supports optional deep enrichment with assets, devices and applicable rules.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: externalId
          in: path
          required: true
          description: ThingsBoard entity UUID stored in customers.external_id
          schema:
            type: string
            format: uuid
        - name: deep
          in: query
          description: Include assets and devices (default 0)
          schema:
            type: integer
            enum: [0, 1]
            default: 0
        - name: allRules
          in: query
          description: Attach applicable rules (DEVICE + ASSET + CUSTOMER scope) to each device and return a unified rules dict (default 0)
          schema:
            type: integer
            enum: [0, 1]
            default: 0
        - name: filterOnlyDevicesWithRules
          in: query
          description: Exclude devices that have no applicable rules (default 0)
          schema:
            type: integer
            enum: [0, 1]
            default: 0
      responses:
        '200':
          description: |
            When deep=0: returns the Customer object directly.
            When deep=1: returns EnrichedCustomer with customer, assets, devices (and rules when allRules=1).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        oneOf:
                          - $ref: '#/components/schemas/Customer'
                          - type: object
                            properties:
                              customer:
                                $ref: '#/components/schemas/Customer'
                              assets:
                                type: array
                                items:
                                  $ref: '#/components/schemas/Asset'
                              devices:
                                type: array
                                items:
                                  allOf:
                                    - $ref: '#/components/schemas/Device'
                                    - properties:
                                        ruleIds:
                                          type: array
                                          description: |
                                            Rule IDs applicable to this device. When the rule has a per-device
                                            value override (`scopeEntityOverrides`), the entry uses the synthesized
                                            key `{ruleId}_{deviceId}` instead of the plain rule UUID — matching
                                            the alarm bundle format consumed by Node-RED.
                                          items:
                                            type: string
                                          example:
                                            - 'cccc0001-0001-0001-0001-000000000002_6857b8cb-34aa-4e2e-9113-8598c2601f31'
                                            - 'cccc0001-0001-0001-0001-000000000001'
                              rules:
                                type: object
                                additionalProperties:
                                  $ref: '#/components/schemas/RuleMeta'
                                description: |
                                  Unified rules dictionary keyed by rule ID (present when allRules=1).
                                  Includes both base rules and synthesized override variants (key = `{ruleId}_{deviceId}`).
                                  Override variants have `parentRuleId` set and reflect the per-device `value`/`valueHigh`.
        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /customers/{id}:
    get:
      tags: [Customers]
      summary: Get customer by ID
      description: >-
        RFC-0057 DEC-11: pass `?include=config` to additionally return the
        consolidated config read model under a NEW `configResolved` field (masked
        secrets). The raw `config` field is unchanged. `include=config` requires
        the same authorization as GET /customers/{id}/config.
      operationId: getCustomer
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PathId'
        - in: query
          name: include
          required: false
          schema: { type: string, example: config }
          description: Comma-separated extras. `config` adds `configResolved` (RFC-0057).
      responses:
        '200':
          description: Customer details (with `configResolved` when `include=config`)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/Customer'
                          - type: object
                            properties:
                              configResolved:
                                $ref: '#/components/schemas/CustomerConfigRead'
        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags: [Customers]
      summary: Update customer
      operationId: updateCustomer
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomer'
      responses:
        '200':
          description: Customer updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/Customer'
    delete:
      tags: [Customers]
      summary: Delete customer
      operationId: deleteCustomer
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Customer deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /customers/{id}/children:
    get:
      tags: [Customers]
