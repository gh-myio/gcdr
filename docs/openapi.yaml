          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items: { type: array, items: { $ref: '#/components/schemas/WorkOrderFile' } }
    post:
      tags: [Work Orders]
      summary: Link a file_asset to the work order
      description: v1 links an existing fileAssetId; multipart upload is a follow-up.
      operationId: woAddFile
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddWorkOrderFileRequest' }
      responses:
