  # Group Channels — per-group routing targets (RFC-0024)
  /groups/{groupId}/channels:
    get:
      tags: [Groups]
      summary: List group channel targets
      description: Returns all configured channel targets for a group (chat_id, email, webhook URL, etc.)
      operationId: listGroupChannels
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: groupId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Group channels
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/GroupChannel'
                          count:
                            type: integer
        '404':
          description: Group not found
    put:
      tags: [Groups]
      summary: Replace all group channel targets
      description: Idempotent full replace — deletes all existing channels and inserts the new set.
      operationId: putGroupChannels
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: groupId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channels]
              properties:
                channels:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [channel, target]
                    properties:
                      channel:
                        type: string
                        enum: [EMAIL, TELEGRAM, WHATSAPP, WEBHOOK, SLACK, SMS, TEAMS, CUSTOM]
                      active:
                        type: boolean
                        default: true
                      target:
                        type: string
                        example: '-100123456789'
                      config:
                        type: object
                        additionalProperties: true
            examples:
              telegram_email:
                summary: Telegram group + email alias
                value:
                  channels:
                    - channel: TELEGRAM
                      active: true
                      target: '-100123456789'
                    - channel: EMAIL
                      active: true
                      target: 'manut-escadas@mestrealvaro.com.br'
      responses:
        '200':
          description: Channels replaced
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/GroupChannel'
                          count:
                            type: integer

  /groups/{groupId}/channels/{channel}:
    patch:
      tags: [Groups]
      summary: Update a single group channel
      operationId: patchGroupChannel
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: groupId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: channel
          in: path
          required: true
          schema:
            type: string
            example: TELEGRAM
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                active:
                  type: boolean
