              type: boolean

    AuditLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
          nullable: true
        userId:
          type: string
          format: uuid
          nullable: true
        actorType:
          type: string
          enum: [USER, SERVICE, SYSTEM, API_KEY]
        entityType:
          type: string
          description: Entity type (CUSTOMER, DEVICE, RULE, etc.)
        entityId:
          type: string
          format: uuid
          nullable: true
        action:
          type: string
          enum: [CREATE, READ, UPDATE, DELETE, LOGIN, LOGOUT, EXPORT]
        eventCategory:
          type: string
          enum: [AUTH, DATA, ADMIN, SYSTEM]
        description:
          type: string
        httpMethod:
          type: string
        httpPath:
          type: string
        statusCode:
          type: integer
        durationMs:
          type: integer
        previousValue:
          type: object
          nullable: true
        newValue:
          type: object
          nullable: true
        metadata:
          type: object
          additionalProperties: true
        ipAddress:
          type: string
        userAgent:
          type: string
        errorMessage:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    ResponseMeta:
      type: object
      properties:
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time

    # Templates (RFC-0021)
    Template:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          example: alarm-notification-v1
        tenantId:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
          nullable: true
          description: "null = tenant default template; UUID = customer-specific override"
        name:
          type: string
        type:
          type: string
          enum: [EMAIL_ALARM, EMAIL_REPORT, EMAIL_WELCOME, RELEASE_NOTE, NOTIFICATION, INSIGHT]
        status:
          type: string
          enum: [DRAFT, ACTIVE, ARCHIVED]
        htmlContent:
          type: string
          description: Full HTML content with {{variable}} and {{#each list}} tags
        description:
          type: string
          nullable: true
        version:
          type: integer
        createdBy:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TemplateSummary:
      type: object
      description: Template without htmlContent
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        tenantId:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
          nullable: true
          description: "null = tenant default; UUID = customer-specific override"
        name:
          type: string
        type:
          type: string
          enum: [EMAIL_ALARM, EMAIL_REPORT, EMAIL_WELCOME, RELEASE_NOTE, NOTIFICATION, INSIGHT]
        status:
          type: string
          enum: [DRAFT, ACTIVE, ARCHIVED]
        description:
          type: string
          nullable: true
        version:
          type: integer
        createdBy:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TemplateRenderResult:
      type: object
      properties:
        html:
          type: string
          description: HTML ready for tag substitution (GET) or fully rendered (POST)
        template:
          type: object
          properties:
            id:
              type: string
              format: uuid
            slug:
              type: string
            type:
              type: string
            version:
              type: integer
            status:
              type: string
            customerId:
              type: string
              format: uuid
              nullable: true
        theme:
          type: object
          nullable: true
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            customerId:
              type: string
              format: uuid
        templateSource:
          type: string
          enum: [customer, parent_customer, tenant]
          description: "customer = template owned by this customer; parent_customer = inherited from parent; tenant = tenant default"
        themeSource:
          type: string
          enum: [customer_type, customer_default, parent_default, tenant]
          description: "customer_type = theme for this specific template type; customer_default = generic customer theme; parent_default = parent's theme; tenant = MYIO fallback"

    CreateTemplate:
      type: object
      required: [slug, name, type, htmlContent]
      properties:
        slug:
          type: string
          pattern: '^[a-z0-9-]+$'
          example: alarm-notification-v1
        name:
          type: string
          example: Alarm Notification Email
        type:
          type: string
          enum: [EMAIL_ALARM, EMAIL_REPORT, EMAIL_WELCOME, RELEASE_NOTE, NOTIFICATION, INSIGHT]
        status:
          type: string
          enum: [DRAFT, ACTIVE, ARCHIVED]
          default: DRAFT
        htmlContent:
          type: string
        description:
          type: string
        customerId:
          type: string
          format: uuid
          nullable: true
          description: "Omit or null for tenant default; UUID for customer-specific override"

    UpdateTemplate:
      type: object
      properties:
        name:
          type: string
        status:
          type: string
          enum: [DRAFT, ACTIVE, ARCHIVED]
        htmlContent:
          type: string
        description:
          type: string

    TemplateTag:
      type: object
      properties:
        tag:
          type: string
          example: '{{customerName}}'
        description:
          type: string
          example: Name of the customer

    TemplateLoopTag:
      type: object
      properties:
        tag:
          type: string
          example: '{{#each rules}}'
        closeTag:
          type: string
          example: '{{/each}}'
        description:
          type: string
        itemTags:
          type: array
          items:
            $ref: '#/components/schemas/TemplateTag'

    GroupChannel:
      type: object
      description: Per-group channel routing target. Stores WHERE to send (chat_id, email, URL). Credentials stay in customer_channels.
      required: [id, tenantId, groupId, channel, active, target]
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        groupId:
          type: string
          format: uuid
        channel:
          type: string
          enum: [EMAIL, TELEGRAM, WHATSAPP, WEBHOOK, SLACK, SMS, TEAMS, CUSTOM]
        active:
          type: boolean
        target:
          type: string
          description: |
            Routing destination for this channel:
            EMAIL → email address ("ops@company.com")
            TELEGRAM → chat_id ("-100123456789")
            WHATSAPP → phone number ("+5531988880000")
            WEBHOOK → URL ("https://hooks.company.com/gcdr")
            SLACK → channel name ("#alertas")
          example: '-100123456789'
        config:
          type: object
          additionalProperties: true
          description: Optional extra config (e.g. webhook method/headers)
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    GroupDispatchEntry:
      type: object
      description: Single entry in the group dispatch matrix (channel × action × active × delay)
      required: [id, tenantId, groupId, channel, action, active, escalationDelayMs]
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        groupId:
          type: string
          format: uuid
        channel:
          type: string
          enum: [EMAIL, TELEGRAM, WHATSAPP, WEBHOOK, SLACK, SMS, TEAMS, CUSTOM]
        action:
          type: string
          enum: [OPEN, ACK, ESCALATE, SNOOZE, CLOSE, STATE_HISTORY]
        active:
          type: boolean
        escalationDelayMs:
          type: integer
          minimum: 0
          description: Delay in milliseconds before this channel fires for this action (0 = immediate)
          example: 5000
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    RuleMeta:
      type: object
      description: |
        Simplified rule summary used in the EnrichedCustomer response (`GET /customers/external/:id?allRules=1`).
        The `id` field may be a plain rule UUID or a synthesized key of the form `{ruleId}_{deviceId}`
        when the rule has a per-device value override (`scopeEntityOverrides`). In that case `parentRuleId`
        is set to the base rule UUID.
      required: [id, name, scope, metric, operator, value]
      properties:
        id:
          type: string
          description: Rule UUID or synthesized override key (`{ruleId}_{deviceId}`)
          example: 'cccc0001-0001-0001-0001-000000000002_6857b8cb-34aa-4e2e-9113-8598c2601f31'
        parentRuleId:
          type: string
          format: uuid
          description: Base rule UUID — only present when `id` is a synthesized override key
          example: 'cccc0001-0001-0001-0001-000000000002'
        name:
          type: string
          example: 'Consumo Elevado'
        description:
          type: string
          example: 'Dispara quando o consumo instantâneo superar o limite configurado'
        scope:
          type: object
          properties:
            type:
              type: string
              enum: [GLOBAL, CUSTOMER, ASSET, DEVICE]
            entityId:
              type: string
              format: uuid
        metric:
          type: string
          example: 'instantaneous_power'
        operator:
          type: string
          enum: [GT, GTE, LT, LTE, EQ, NEQ, BETWEEN, OUTSIDE, UNCHANGED]
          example: 'GT'
        value:
          type: number
          description: Trigger threshold — may be overridden per device (see parentRuleId)
          example: 299
        valueHigh:
          type: number
          description: Upper bound for BETWEEN/OUTSIDE operators
        duration:
          type: integer
          description: Seconds the condition must persist before firing
        hysteresis:
          type: number
        aggregation:
          type: string
          enum: [AVG, MIN, MAX, SUM, COUNT, LAST]
        startAt:
          type: string
          pattern: '^\d{2}:\d{2}$'
          example: '08:00'
        endAt:
          type: string
          pattern: '^\d{2}:\d{2}$'
          example: '18:00'
        daysOfWeek:
          type: object
          description: Map of day index (0=Sun … 6=Sat) to active boolean
          example: { "0": false, "1": true, "2": true, "3": true, "4": true, "5": true, "6": false }
        channelId:
          type: integer
          description: Channel index for multi-channel OUTLET devices
        keyMulti:
          type: number
          description: Energy unit multiplier (1 = W, 0.25 = Wh)
          default: 1

    SetDeviceOverride:
      type: object
      description: Per-device value override for an alarm threshold rule
      properties:
        value:
          type: number
          description: Override trigger threshold for this device
          example: 299
        valueHigh:
          type: number
          description: Override upper bound for BETWEEN/OUTSIDE operators

paths:
  # Health
  /health:
    get:
      tags:
        - Health
      summary: Health check
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/HealthStatus'

  # Authentication
  /auth/login:
    post:
      tags: [Authentication]
      summary: User login
      description: |
        Authenticates a user with email and password.

        If MFA is enabled for the user, returns a temporary MFA token instead of access tokens.
        The client must then call `/auth/mfa/verify` to complete authentication.
      operationId: authLogin
      security: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful (or MFA required)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/LoginResponse'
                  - $ref: '#/components/schemas/MfaRequiredResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Refresh access token
      description: |
        Exchanges a valid refresh token for new access and refresh tokens.
        The old refresh token is invalidated.
      operationId: authRefresh
      security: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Tokens refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/mfa/verify:
    post:
      tags: [Authentication]
      summary: Verify MFA code
      description: |
        Completes the MFA verification step after login.
        Requires the temporary MFA token from the login response.
      operationId: authMfaVerify
      security: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaVerifyRequest'
      responses:
        '200':
          description: MFA verified, tokens issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid MFA code or token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/logout:
    post:
      tags: [Authentication]
      summary: Logout user
      description: |
        Invalidates the current session.
        Optionally invalidates all sessions for the user.
      operationId: authLogout
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessageResponse'

  /auth/password/forgot:
    post:
      tags: [Authentication]
      summary: Request password reset
      description: |
        Sends a password reset email to the user.
        Always returns success to prevent email enumeration.
      operationId: authForgotPassword
      security: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '200':
          description: Password reset email sent (if user exists)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessageResponse'

  /auth/forgot-password:
    post:
      tags: [Authentication]
      summary: Request password reset (RFC-0011)
      description: |
        Sends a 6-digit verification code to the user's email.
        Code expires in 15 minutes. Always returns success to prevent email enumeration.
      operationId: authForgotPasswordV2
      security: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Reset code sent (if user exists)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessageResponse'

  /auth/reset-password:
    post:
      tags: [Authentication]
      summary: Reset password with 6-digit code (RFC-0011)
      description: |
        Resets the user password using a 6-digit code received via email.
        If the account was locked, it will be automatically unlocked.
      operationId: authResetPasswordV2
      security: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code, newPassword]
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
                  pattern: '^\d{6}$'
                  example: '123456'
                newPassword:
                  type: string
                  minLength: 8
      responses:
        '200':
          description: Password reset successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                      unlocked:
                        type: boolean
        '401':
          description: Invalid or expired code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # RFC-0011: User Registration
  /auth/register:
    post:
      tags: [Registration]
      summary: Self-service user registration
      description: |
        Creates a new user account with UNVERIFIED status.
        A 6-digit verification code is sent to the email (valid for 15 minutes).
      operationId: authRegister
      security: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, firstName, lastName]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                  description: Min 8 chars, 1 uppercase, 1 lowercase, 1 number, 1 special char
                firstName:
                  type: string
                  minLength: 2
                lastName:
                  type: string
                  minLength: 2
                phone:
                  type: string
                customerId:
                  type: string
                  format: uuid
      responses:
        '201':
          description: User created, verification code sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      userId:
                        type: string
                        format: uuid
                      email:
                        type: string
                      status:
                        type: string
                        enum: [UNVERIFIED]
                      message:
                        type: string
                      expiresIn:
                        type: integer
                        description: Code expiry in seconds
        '400':
          description: Validation error or email already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/verify-email:
    post:
      tags: [Registration]
      summary: Verify email with 6-digit code
      description: |
        Verifies the user's email address using the 6-digit code sent during registration.
        On success, user status changes from UNVERIFIED to PENDING_APPROVAL.
      operationId: authVerifyEmail
      security: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
                  pattern: '^\d{6}$'
                  example: '123456'
      responses:
        '200':
          description: Email verified, awaiting approval
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        enum: [PENDING_APPROVAL]
                      message:
                        type: string
        '401':
          description: Invalid or expired code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/resend-verification:
    post:
      tags: [Registration]
      summary: Resend verification code
      description: |
        Resends the 6-digit verification code to the user's email.
        Rate limited to 3 resends per hour.
      operationId: authResendVerification
      security: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Code resent (if user exists and is unverified)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessageResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # RFC-0011: Admin User Management
  /admin/users/pending-approval:
    get:
      tags: [Admin Users]
      summary: List users pending approval
      description: Returns all users with PENDING_APPROVAL status
      operationId: adminListPendingApproval
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: List of pending users
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                            email:
                              type: string
                            firstName:
                              type: string
                            lastName:
                              type: string
                            registeredAt:
                              type: string
                              format: date-time
                            emailVerifiedAt:
                              type: string
                              format: date-time
                            registrationIp:
                              type: string
                      total:
                        type: integer

  /admin/users/locked:
    get:
      tags: [Admin Users]
      summary: List locked users
      description: Returns all users with LOCKED status
      operationId: adminListLocked
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: List of locked users
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                            email:
                              type: string
                            firstName:
                              type: string
                            lastName:
                              type: string
                            lockedAt:
                              type: string
                              format: date-time
                            lockedReason:
                              type: string
                            lockoutCount:
                              type: integer
                            failedLoginAttempts:
                              type: integer
                      total:
                        type: integer

  /admin/users/{userId}/approve:
    post:
      tags: [Admin Users]
      summary: Approve user registration
      description: Changes user status from PENDING_APPROVAL to ACTIVE
      operationId: adminApproveUser
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                assignRoles:
                  type: array
                  items:
                    type: string
                customerId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: User approved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      userId:
                        type: string
                        format: uuid
                      status:
                        type: string
                        enum: [ACTIVE]
                      message:
                        type: string

  /admin/users/{userId}/reject:
    post:
      tags: [Admin Users]
      summary: Reject user registration
      description: Changes user status from PENDING_APPROVAL to INACTIVE
      operationId: adminRejectUser
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 1
      responses:
        '200':
          description: User rejected
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      userId:
                        type: string
                        format: uuid
                      status:
                        type: string
                        enum: [INACTIVE]
                      message:
                        type: string

  /admin/users/{userId}/unlock:
    post:
      tags: [Admin Users]
      summary: Unlock user account
      description: Changes user status from LOCKED to ACTIVE and resets failed login attempts
      operationId: adminUnlockUser
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User unlocked
