  # ===========================================================================
  # RFC-0023: Device Sync Jobs
  # ===========================================================================

  /api/v1/device-sync/jobs:
    post:
      tags: [Device Sync Jobs]
      summary: Create and enqueue a device sync job
      description: |
        Creates a new device synchronization job and immediately enqueues it for background processing.
        Returns `202 Accepted` with the `jobId`. The job runs asynchronously through 6 phases:
        `CHECK → ACTION_PLAN → DETECT_RELOCATIONS → RELOCATE → APPLY_UPDATES → CONSOLIDATE_CREATES`

        Use `GET /api/v1/device-sync/jobs/:jobId` to poll status.
      security:
        - apiKeyAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerId, files]
              properties:
                customerId:
                  type: string
                  format: uuid
                  description: Target customer for the sync
                defaultAssetId:
                  type: string
                  format: uuid
                  description: Default asset used when gcdrAssetId is empty in the file
                dryRun:
                  type: boolean
                  default: false
                  description: If true, simulates all operations without writing to DB
                files:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    type: object
                    required: [name, content]
                    properties:
                      name:
                        type: string
                        minLength: 1
                        maxLength: 255
                      content:
                        type: string
                        description: Pipe-delimited device-map. First line must be the header tbId|deviceName|...
            example:
              customerId: "84e0370e-636a-4741-9874-504b5e0b3577"
              defaultAssetId: "8a9c669b-855f-4c2f-bd60-e0541238b980"
              dryRun: false
              files:
                - name: "energy-stores"
                  content: "tbId|deviceName|label|identifier|deviceType|deviceProfile|slaveId|centralId|gcdrCustomerId|gcdrAssetId|gcdrDeviceId|gcdrSyncAt\n52ea1510-...|3F SCMOXUARA102BCL1|SUPERMERCADOS_BH|102BC_L1|3F_MEDIDOR|3F_MEDIDOR|2|e982edf9-...|||||"
      responses:
        '202':
          description: Job accepted and enqueued
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      jobId:   { type: string, format: uuid }
                      status:  { type: string, example: QUEUED }
        '400':
          description: Validation error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Customer not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

    get:
      tags: [Device Sync Jobs]
      summary: List device sync jobs
      description: Lists jobs for the tenant with optional filters and pagination.
      security:
        - apiKeyAuth: []
        - bearerAuth: []
      parameters:
        - name: customerId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema:
            type: string
            enum: [QUEUED, RUNNING, DONE, PARTIAL, FAILED]
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: List of jobs
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DeviceSyncJobSummary'
                  pagination:
                    type: object
                    properties:
                      page:       { type: integer }
                      pageSize:   { type: integer }
                      total:      { type: integer }
                      totalPages: { type: integer }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/device-sync/jobs/{jobId}:
    get:
      tags: [Device Sync Jobs]
      summary: Get job status and summary
      description: |
        Returns the current status, active phase, per-phase summary counters, and duration.
        Poll until `status` is `DONE`, `PARTIAL`, or `FAILED`.
      security:
        - apiKeyAuth: []
        - bearerAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Job status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/DeviceSyncJobStatus'
        '404':
          description: Job not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/device-sync/jobs/{jobId}/log:
    get:
      tags: [Device Sync Jobs]
      summary: Get structured job log
      description: Returns the full structured log. Filter entries by `level=FAIL` to highlight errors.
      security:
        - apiKeyAuth: []
        - bearerAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Structured log entries
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        type: object
                        properties:
                          jobId:
                            type: string
                            format: uuid
                          status:
                            type: string
                            enum: [QUEUED, RUNNING, DONE, PARTIAL, FAILED]
                          entries:
                            type: array
                            items:
                              $ref: '#/components/schemas/DeviceSyncLogEntry'
        '404':
          description: Job not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # =============================================================================
  # Access Bundle (RFC-0013)
  # =============================================================================

  /access-bundle/me:
    get:
      tags: [Access Bundle]
      summary: Get access bundle for the authenticated user
      description: |
        Returns the hierarchical permission bundle for the caller.
        Uses cache by default; pass `useCache=false` to regenerate.
      operationId: getAccessBundleMe
      parameters:
        - in: query
          name: scope
          schema: { type: string, default: '*' }
        - in: query
          name: includeFeatures
          schema: { type: boolean, default: true }
        - in: query
          name: includeDomains
          schema: { type: boolean, default: true }
        - in: query
          name: includeFlat
          schema: { type: boolean, default: true }
        - in: query
          name: ttl
          schema: { type: integer, minimum: 60, maximum: 86400, default: 3600 }
        - in: query
          name: useCache
          schema: { type: boolean, default: true }
      responses:
        '200':
          description: User access bundle
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data: { $ref: '#/components/schemas/UserAccessBundle' }

  /access-bundle/users/{targetUserId}:
    get:
      tags: [Access Bundle]
      summary: Get access bundle for a specific user (admin)
      operationId: getAccessBundleForUser
      parameters:
        - in: path
          name: targetUserId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: scope
          schema: { type: string, default: '*' }
        - in: query
          name: useCache
          schema: { type: boolean, default: true }
      responses:
        '200':
          description: User access bundle
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data: { $ref: '#/components/schemas/UserAccessBundle' }

  /access-bundle/me/refresh:
    post:
      tags: [Access Bundle]
      summary: Force-refresh the caller's bundle (invalidates cache and regenerates)
      operationId: refreshAccessBundleMe
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 255 }
      responses:
        '200':
          description: Regenerated bundle
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data: { $ref: '#/components/schemas/UserAccessBundle' }

  /access-bundle/users/{targetUserId}/refresh:
    post:
      tags: [Access Bundle]
      summary: Force-refresh a specific user's bundle (admin)
      operationId: refreshAccessBundleForUser
      parameters:
        - in: path
          name: targetUserId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 255 }
      responses:
        '200':
          description: Regenerated bundle
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data: { $ref: '#/components/schemas/UserAccessBundle' }

  /access-bundle/users/{targetUserId}/cache:
    delete:
      tags: [Access Bundle]
      summary: Invalidate a user's cached bundle (admin)
      operationId: invalidateAccessBundleCache
      parameters:
        - in: path
          name: targetUserId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 255 }
                scope: { type: string }
      responses:
        '204':
          description: Cache invalidated

  /access-bundle/check:
    post:
      tags: [Access Bundle]
      summary: Check a single domain permission for the authenticated user
      operationId: checkAccessBundlePermission
      parameters:
        - in: query
          name: scope
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckDomainPermissionRequest' }
      responses:
        '200':
          description: Check result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        type: object
                        properties:
                          allowed: { type: boolean }
                          permission:
                            $ref: '#/components/schemas/CheckDomainPermissionRequest'

  /access-bundle/check-batch:
    post:
      tags: [Access Bundle]
      summary: Check multiple domain permissions at once
      description: |
        Note: path uses a hyphen (`check-batch`), **not** `/check/batch`.
      operationId: checkAccessBundlePermissionsBatch
      parameters:
        - in: query
          name: scope
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckMultipleDomainPermissionsRequest' }
      responses:
        '200':
          description: Batch check result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        type: object
                        properties:
                          results:
                            type: object
                            description: |
                              Map keyed by `domain.equipment.location:action` with boolean values.
                          summary:
                            type: object
                            properties:
                              total: { type: integer }
                              allowed: { type: integer }
                              denied: { type: integer }

  /access-bundle/check-feature:
    post:
      tags: [Access Bundle]
      summary: Check feature-level access for the authenticated user
      operationId: checkAccessBundleFeature
      parameters:
        - in: query
          name: scope
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [featureKey]
              properties:
                featureKey: { type: string }
      responses:
        '200':
          description: Feature check result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        type: object
                        properties:
                          featureKey: { type: string }
                          allowed: { type: boolean }
                          access:
                            type: string
                            enum: [guaranteed, granted, conditional, denied, not_granted]

  /access-bundle/domain-permissions:
    get:
      tags: [Access Bundle]
      summary: List domain permissions (registry)
      operationId: listDomainPermissions
      parameters:
        - in: query
          name: domain
          schema: { type: string }
        - in: query
          name: equipment
          schema: { type: string }
        - in: query
          name: location
          schema: { type: string }
        - in: query
          name: action
          schema: { type: string }
        - in: query
          name: isActive
          schema: { type: boolean }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: List of domain permissions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/DomainPermission' }
                          total: { type: integer }
    post:
      tags: [Access Bundle]
      summary: Create a domain permission (admin)
      operationId: createDomainPermission
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDomainPermission' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data: { $ref: '#/components/schemas/DomainPermission' }

  /access-bundle/domain-permissions/bulk:
    post:
      tags: [Access Bundle]
      summary: Create multiple domain permissions at once (admin)
      operationId: bulkCreateDomainPermissions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permissions]
              properties:
                permissions:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { $ref: '#/components/schemas/CreateDomainPermission' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        type: object
                        properties:
                          created: { type: integer }
                          permissions:
                            type: array
                            items: { $ref: '#/components/schemas/DomainPermission' }

  /access-bundle/domain-permissions/{permissionId}:
    put:
      tags: [Access Bundle]
      summary: Update a domain permission (admin)
      operationId: updateDomainPermission
      parameters:
        - in: path
          name: permissionId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateDomainPermission' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data: { $ref: '#/components/schemas/DomainPermission' }
    delete:
      tags: [Access Bundle]
      summary: Delete a domain permission (admin)
      operationId: deleteDomainPermission
      parameters:
        - in: path
          name: permissionId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Deleted

  /access-bundle/domain-permissions/domains:
    get:
      tags: [Access Bundle]
      summary: List available domain slugs
      operationId: listDomainPermissionDomains
      responses:
        '200':
          description: Domains list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        type: object
                        properties:
                          domains:
                            type: array
                            items: { type: string }

  /access-bundle/domain-permissions/domains/{domain}/equipments:
    get:
      tags: [Access Bundle]
      summary: List equipments under a domain
      operationId: listDomainPermissionEquipments
      parameters:
        - in: path
          name: domain
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Equipments list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        type: object
                        properties:
                          domain: { type: string }
                          equipments:
                            type: array
                            items: { type: string }

  /access-bundle/domain-permissions/domains/{domain}/equipments/{equipment}/locations:
    get:
      tags: [Access Bundle]
      summary: List locations for an equipment under a domain
      operationId: listDomainPermissionLocations
      parameters:
        - in: path
          name: domain
          required: true
          schema: { type: string }
        - in: path
          name: equipment
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Locations list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        type: object
                        properties:
                          domain: { type: string }
                          equipment: { type: string }
                          locations:
                            type: array
                            items: { type: string }

