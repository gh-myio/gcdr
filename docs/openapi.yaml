      description: |
        Sets (or replaces) the value override for a specific device in a rule's `scopeEntityOverrides`.
        Other devices' overrides are preserved.
        When an override exists, the device receives a synthesized rule key `{ruleId}_{deviceId}`
        in `GET /customers/external/:id` and in the alarm bundle.
      operationId: setDeviceOverride
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PathId'
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetDeviceOverride'
            examples:
              threshold:
                summary: Override trigger threshold
                value: { "value": 299 }
              between:
                summary: Override BETWEEN bounds
                value: { "value": 200, "valueHigh": 350 }
      responses:
        '200':
          description: Rule updated with new override
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/Rule'
        '404':
          description: Rule or device not found
    delete:
      tags: [Rules]
      summary: Remove per-device value override
      description: |
        Removes the value override for a specific device. The device reverts to the rule's default
        `alarmConfig.value`. Other devices' overrides are preserved.
      operationId: deleteDeviceOverride
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PathId'
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Rule updated — override removed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/Rule'
        '404':
          description: Rule or device not found

