  # ===========================================================================
  # Customer Config Document (RFC-0057)
  # ===========================================================================

  /customers/{customerId}/config:
    get:
      tags: [Customer Config]
      summary: Read the consolidated customer config (masked secrets)
      description: >-
        Returns the normalized read model with defaults filled and secrets
        masked. Auth: JWT (customers.hierarchy.read on customer:<id>) or a
        customer API key with `customers:read` whose hierarchy reaches the
        customer. Cross-tenant / out-of-reach → 404.
      operationId: getCustomerConfig
      security: [{ bearerAuth: [] }, { apiKeyAuth: [] }]
      parameters:
        - in: path
          name: customerId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Config document
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data: { $ref: '#/components/schemas/CustomerConfigRead' }
        '401': { description: Missing/invalid authentication }
        '403': { description: Authenticated but lacking the required scope/permission }
        '404': { description: Customer not found / outside the key's reach }
    put:
      tags: [Customer Config]
      summary: Replace the writable config sections
      description: >-
        Full replace; an omitted section resets to its default. `featureButtons`,
        when present, must be the complete 2×3 matrix. Secret fields are rejected
        (400). Auth: customers:write / customers.hierarchy.update.
      operationId: replaceCustomerConfig
      security: [{ bearerAuth: [] }, { apiKeyAuth: [] }]
      parameters:
        - in: path
          name: customerId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerConfigWrite' }
      responses:
        '200':
          description: Updated config document
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data: { $ref: '#/components/schemas/CustomerConfigRead' }
        '400': { description: Unknown key, secret field, temperature invariant, size cap, or null on a governed section }
        '403': { description: Lacking the required scope/permission }
        '404': { description: Customer not found / outside the key's reach }
    patch:
      tags: [Customer Config]
      summary: Deep-merge a subset of the config
      description: >-
        Deep-merge; `featureButtons` merges per group key (an empty object is a
        no-op). Secret fields rejected (400). Auth: customers:write /
        customers.hierarchy.update.
      operationId: patchCustomerConfig
      security: [{ bearerAuth: [] }, { apiKeyAuth: [] }]
      parameters:
        - in: path
          name: customerId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerConfigPatch' }
            example:
              featureButtons: { demandPeak: { lojas: true } }
      responses:
        '200':
          description: Updated config document
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data: { $ref: '#/components/schemas/CustomerConfigRead' }
        '400': { description: Unknown key, secret field, temperature invariant, size cap, or null on a governed section }
        '403': { description: Lacking the required scope/permission }
        '404': { description: Customer not found / outside the key's reach }
    delete:
      tags: [Customer Config]
      summary: Reset the writable config sections to defaults
      description: >-
        Resets writable sections; preserves `settings`, `theme`, the alarm
        `bundle` config, and the at-rest secrets. Returns the full read model.
      operationId: resetCustomerConfig
      security: [{ bearerAuth: [] }, { apiKeyAuth: [] }]
      parameters:
        - in: path
          name: customerId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Config reset to defaults
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data: { $ref: '#/components/schemas/CustomerConfigRead' }
        '403': { description: Lacking the required scope/permission }
        '404': { description: Customer not found / outside the key's reach }

  /customers/{customerId}/config/secrets:
    get:
      tags: [Customer Config]
      summary: Reveal the real secret values (JWT-only, audited)
      description: >-
        Returns decrypted `ingestion.clientSecret` and
        `security.masterAdminPassword` (each possibly null). JWT/master-key only
        with the high-risk `customers.secret.reveal` permission on
        customer:<id> (granted via policy:customer-secrets; NOT reachable by the
        read-only *.*.read policy). Customer API keys are DENIED (401). Every
        reveal is audit-logged.
      operationId: revealCustomerConfigSecrets
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: customerId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Decrypted secrets
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data: { $ref: '#/components/schemas/CustomerConfigSecretsRevealed' }
        '401': { description: Customer API key (denied) or missing/invalid JWT }
        '403': { description: JWT lacking customers.secret.reveal }
        '404': { description: Customer not found }
    put:
      tags: [Customer Config]
      summary: Set or clear secrets (JWT-only, audited)
      description: >-
        A string sets & encrypts at rest; `null` clears; the masked sentinel
        "***" is rejected (400). JWT/master-key only with the high-risk
        `customers.secret.manage` permission; customer API keys DENIED (401).
        Returns the masked read model.
      operationId: writeCustomerConfigSecrets
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: customerId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerConfigSecretsWrite' }
            example:
              ingestion: { clientSecret: s3cr3t }
              security: { masterAdminPassword: null }
      responses:
        '200':
          description: Secrets updated (masked read model returned)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data: { $ref: '#/components/schemas/CustomerConfigRead' }
        '400': { description: Masked sentinel "***" or unknown key }
        '401': { description: Customer API key (denied) or missing/invalid JWT }
        '403': { description: JWT lacking customers.secret.manage }
        '404': { description: Customer not found }

  # ===========================================================================
