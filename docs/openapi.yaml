      description: |
        Writes `preferences.defaultCustomerId`. Validates that the customer
        exists **and** that the user has an active role assignment with
        scope `customer:<customerId>` or `*`. Pass `{ "customerId": null }`
        to clear.

        Cleanup hooks keep this field from becoming dangling:
          - When a customer is deleted, every user pointing to it is cleared.
          - When a user's last assignment for a customer is revoked, the
            field is cleared if it still pointed to that customer.
      operationId: setUserDefaultCustomer
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
