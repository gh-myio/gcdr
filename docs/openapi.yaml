                          properties:
                            id:
                              type: string
                              format: uuid
                            email:
                              type: string
                            firstName:
                              type: string
                            lastName:
                              type: string
                            registeredAt:
                              type: string
                              format: date-time
                            emailVerifiedAt:
                              type: string
                              format: date-time
                            registrationIp:
                              type: string
                      total:
                        type: integer

  /admin/users/locked:
