                      data: { $ref: '#/components/schemas/MaintenanceGroup' }
    get:
      tags: [Maintenance Groups]
      summary: List maintenance groups
      operationId: listMaintenanceGroups
      parameters:
        - in: query
          name: customerId
          schema: { type: string, format: uuid }
        - in: query
          name: isActive
          schema: { type: boolean }
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
