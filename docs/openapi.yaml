            type: string
            format: uuid
        - name: type
          in: query
          schema:
            type: string
            enum: [ROOT, RESELLER, ENTERPRISE, BUSINESS, INDIVIDUAL]
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, INACTIVE, SUSPENDED]
      responses:
        '200':
          description: List of customers
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
