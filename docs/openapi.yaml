  # RFC-0046 — Consumption Goals (nested under /customers)
  /customers/{customerId}/goals:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: customerId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Consumption Goals]
      summary: Get the resolved goal for a (domain, year)
      description: 'Returns the goal tree with coarser levels rolled up on read. `domain` and `year` are required together. Scope `goals:read`.'
      operationId: getConsumptionGoals
      parameters:
        - { name: domain, in: query, required: true, schema: { type: string, enum: [ENERGY, WATER, TEMPERATURE] } }
        - { name: year, in: query, required: true, schema: { type: integer, example: 2026 } }
        - { name: granularity, in: query, required: false, description: 'Derived view depth (default month)', schema: { type: string, enum: [year, month, day, hour], default: month } }
        - { name: fetchHistory, in: query, required: false, description: 'Include ≤100 history entries (newest-first)', schema: { type: boolean } }
        - { name: deviceId, in: query, required: false, description: 'Addendum A: narrow the tree to ONE meter of a DEVICE-granular year. The response also carries granularity, devices[], hoursCovered and coverageGaps — see RFC-0046-Goals-API.md §7.', schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Resolved goal
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data: { $ref: '#/components/schemas/GoalTree' }
        '400':
          description: domain/year missing or invalid
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '404':
          description: No goal for this (customer, domain, year)
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    put:
      tags: [Consumption Goals]
      summary: Replace the whole (domain, year)
      description: 'PUT = replace — buckets absent from the payload scope are removed; values distribute to the hourly grain. Optimistic `expectedVersion` → 409. Scope `goals:write`.'
      operationId: replaceConsumptionGoals
      parameters:
        - { name: domain, in: query, required: true, schema: { type: string, enum: [ENERGY, WATER, TEMPERATURE] } }
        - { name: year, in: query, required: true, schema: { type: integer } }
        - { name: deviceId, in: query, required: false, description: 'Addendum A: target ONE entry meter (implicit CUSTOMER→DEVICE conversion on the first device write). A deviceless PUT on a DEVICE year must state body.granularity.', schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/GoalsReplaceBody' } } }
      responses:
        '200':
          description: Replaced (new version in X-Version-Id)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data: { $ref: '#/components/schemas/GoalsWriteResult' }
        '400':
          description: Invalid body
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '409':
          description: 'VERSION_CONFLICT — expectedVersion mismatch (body carries currentVersion)'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    patch:
      tags: [Consumption Goals]
      summary: Merge sparse buckets
      description: 'PATCH = merge — only the named buckets are (re)distributed; everything else preserved. Scope `goals:write`.'
      operationId: mergeConsumptionGoals
      parameters:
        - { name: domain, in: query, required: true, schema: { type: string, enum: [ENERGY, WATER, TEMPERATURE] } }
        - { name: year, in: query, required: true, schema: { type: integer } }
        - { name: deviceId, in: query, required: false, description: 'Addendum A: target ONE entry meter.', schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/GoalsMergeBody' } } }
      responses:
        '200':
          description: Merged (new version in X-Version-Id)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data: { $ref: '#/components/schemas/GoalsWriteResult' }
        '400':
          description: Invalid body
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '409':
          description: VERSION_CONFLICT
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    delete:
      tags: [Consumption Goals]
      summary: Delete a (domain, year) or a single sub-bucket
      description: 'Deletes the whole year (no body / no guard → 204) or a sub-bucket. With `expectedVersion` returns 200 + body. Scope `goals:write`.'
      operationId: deleteConsumptionGoals
      parameters:
        - { name: domain, in: query, required: true, schema: { type: string, enum: [ENERGY, WATER, TEMPERATURE] } }
        - { name: year, in: query, required: true, schema: { type: integer } }
        - { name: deviceId, in: query, required: false, description: 'Addendum A: scope the delete to ONE meter (removal modes — see GoalsDeleteBody.mode).', schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: '#/components/schemas/GoalsDeleteBody' } } }
      responses:
        '200':
          description: Deleted with optimistic guard (body returned)
          content: { application/json: { schema: { $ref: '#/components/schemas/SuccessResponse' } } }
        '204':
          description: Deleted (no guard)
        '409':
          description: VERSION_CONFLICT
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }

  /customers/{customerId}/goals/margin:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: customerId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [Consumption Goals]
      summary: Set the goal margin overlay (RFC-0052)
      description: |
        Sets one signed percentage per (customer, domain, year) — "Margem da
        meta". Read-time overlay: buckets stay raw; reads gain `adjustedValue =
        value × (1 + goalMarginPct/100)` on every tree node. Upsert (creates the
        parent goal when absent); shares the goal's optimistic `version`
        (mismatch → 409); writing the same pct is a no-op. Every effective
        change appends a history entry with `source: MARGIN` and is audited
        (GOAL_MARGIN_CHANGED). Scope `goals:write`.
      operationId: setGoalMargin
      parameters:
        - { name: domain, in: query, required: true, schema: { type: string, enum: [ENERGY, WATER, TEMPERATURE] } }
        - { name: year, in: query, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [goalMarginPct]
              properties:
                goalMarginPct: { type: number, minimum: -100, maximum: 100, multipleOf: 0.01, example: -5 }
                expectedVersion: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Margin applied (month-granularity tree with adjustedValue)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data: { $ref: '#/components/schemas/GoalTree' }
        '400':
          description: Invalid pct (range/precision) or params
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '409':
          description: VERSION_CONFLICT
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    delete:
      tags: [Consumption Goals]
      summary: Clear the goal margin overlay (RFC-0052)
      description: 'Removes the margin (back to raw targets). History records old pct → null. 404 when the (domain, year) has no goal; clearing an absent margin is a no-op. Scope `goals:write`.'
      operationId: clearGoalMargin
      parameters:
        - { name: domain, in: query, required: true, schema: { type: string, enum: [ENERGY, WATER, TEMPERATURE] } }
        - { name: year, in: query, required: true, schema: { type: integer } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                expectedVersion: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Margin cleared
          content: { application/json: { schema: { $ref: '#/components/schemas/SuccessResponse' } } }
        '404':
          description: No goal for this (customer, domain, year)
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '409':
          description: VERSION_CONFLICT
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }

  /customers/{customerId}/single-dashboard:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: customerId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Single Dashboard]
      summary: Single Dashboard aggregated snapshot (RFC-0053)
      description: |
        Read-only composition for the single-customer operational dashboard (Single Dashboard):
        device groups (energy | water | temperature — water spans the whole
        hydric infrastructure including tanks/pumps/level sensors, mapped by
        profile/type with per-customer overrides in
        `customer.settings.singleDashboard.groupOverrides`), an explainable
        health score, goal progress (RFC-0046 targets + RFC-0052
        `adjustedValue`), heuristic insights and per-section soft errors.
        Telemetry fields degrade to `available:false` while the ingestion
        read-through contract is pending (RFC-0053 Q1). Scope `customers:read`.
        JWT users go through real RBAC (`dashboard.single.read` with
        `customer:<id>` / `customer:<id>/asset:<id>` scopes); a single-asset
        grant is auto-narrowed and `?assetId=` filters the snapshot to one
        asset's devices.
      operationId: getSingleDashboard
      parameters:
        - { name: from, in: query, required: false, schema: { type: string, format: date }, description: 'Range start (ISO date/datetime); forwarded to the telemetry read-through.' }
        - { name: to, in: query, required: false, schema: { type: string, format: date } }
      responses:
        '200':
          description: Aggregated store snapshot
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SingleDashboard' }
        '404':
          description: Customer not found
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }

  /customers/{customerId}/goals/import:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: customerId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Consumption Goals]
      summary: Import goals from CSV (preview or persist)
      description: 'Stateless CSV import (merge semantics). `dryRun=true` (default) previews + diagnostics WITHOUT persisting; re-post the same CSV with `dryRun=false` to persist (no previewToken). Scope `goals:write`.'
      operationId: importConsumptionGoals
      parameters:
        - { name: domain, in: query, required: true, schema: { type: string, enum: [ENERGY, WATER, TEMPERATURE] } }
        - { name: year, in: query, required: true, schema: { type: integer } }
        - { name: dryRun, in: query, required: false, description: 'true (default) = preview only; false = persist', schema: { type: boolean, default: true } }
        - { name: deviceId, in: query, required: false, description: 'Addendum A: import ONE meter''s spreadsheet (the per-sensor flow).', schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/GoalsImportBody' } } }
      responses:
        '200':
          description: Preview (dryRun) or persisted result
          content: { application/json: { schema: { $ref: '#/components/schemas/SuccessResponse' } } }
        '400':
          description: Invalid CSV or params
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '409':
          description: VERSION_CONFLICT
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }

  /customers/{customerId}/goals/rebalance:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: customerId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Consumption Goals]
      summary: Rebalance the residual allocation (Addendum A, DEC-12)
      description: 'Recomputes the RESIDUAL allocation of a DEVICE-granular year against the CURRENT entry-meter set — registering/reclassifying a meter never alters goals by itself. `dryRun=true` (default) previews the before/after per meter (entering/leaving) without writing; `dryRun=false` applies under `body.expectedVersion` with ONE version bump and ONE REBALANCE history entry. Full shape: RFC-0046-Goals-API.md §7.3. Scope `goals:write`.'
      operationId: rebalanceConsumptionGoals
      parameters:
        - { name: domain, in: query, required: true, schema: { type: string, enum: [ENERGY, WATER, TEMPERATURE] } }
        - { name: year, in: query, required: true, schema: { type: integer } }
        - { name: dryRun, in: query, required: false, description: 'true (default) = preview only; false = apply', schema: { type: boolean, default: true } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                expectedVersion: { type: integer }
      responses:
        '200':
          description: Preview (dryRun) or applied result — per-meter before/after, entering/leaving deviceIds
          content: { application/json: { schema: { $ref: '#/components/schemas/SuccessResponse' } } }
        '409':
          description: VERSION_CONFLICT
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '422':
          description: 'GOAL_ENTRY_SET_UNDEFINED — no ACTIVE ENTRY meter classified for the domain'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }

