# SonarCloud configuration for GCDR API.
#
# Quality gate (configured in SonarCloud, NOT here):
#   - Coverage on new code: ≥ 50%
#   - Duplicated lines on new code: ≤ 3%
#   - Maintainability rating on new code: A
#   - Reliability rating on new code: A
#   - Security rating on new code: A
#   - Security hotspots reviewed: 100%
#
# "New code" = code introduced in the PR (not the whole codebase). Old code
# is held to its current baseline; raising the bar there is a separate
# (longer) effort tracked in docs/QUALITY-GATE-SONAR.md.

# ---- Identity ---------------------------------------------------------------
sonar.projectKey=gh-myio_gcdr
sonar.organization=gh-myio
sonar.projectName=GCDR API
sonar.projectVersion=1.0

# ---- Sources ----------------------------------------------------------------
sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# ---- Test + coverage --------------------------------------------------------
# Jest writes lcov to coverage/lcov.info via the "lcov" reporter in jest.config.js.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.testExecutionReportPaths=coverage/test-report.xml

# ---- Exclusions -------------------------------------------------------------
# Auto-generated, vendored, or non-product code that shouldn't count toward
# coverage / duplications / smells.
sonar.exclusions=\
  dist/**, \
  coverage/**, \
  node_modules/**, \
  drizzle/migrations/**, \
  scripts/**, \
  src/**/*.d.ts, \
  src/handlers/docs/**, \
  src/infrastructure/database/drizzle/schema.ts, \
  src/dto/response/**, \
  src/dto/request/**, \
  src/domain/entities/**

# Tests themselves are not subject to duplication/smell rules.
sonar.test.exclusions=tests/**, src/**/*.test.ts

# Files that count toward coverage but whose own coverage is not enforced.
sonar.coverage.exclusions=\
  src/app.ts, \
  src/server.ts, \
  src/handlers/**, \
  src/middleware/upload.ts, \
  src/infrastructure/**, \
  src/scripts/**, \
  src/services/SimulatorStartup.ts, \
  src/services/email-templates.ts, \
  src/mcp/**

# ---- Language settings ------------------------------------------------------
sonar.typescript.tsconfigPath=tsconfig.json
